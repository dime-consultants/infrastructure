name: Base Server Configuration

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/base-configure.yml"
      - "ansible/data/**"
      - "ansible/inventory/**"
      - "ansible/playbooks/base-setup.yml"
      - "ansible/playbooks/deploy-shared-services.yml"
      - "ansible/shared-services/**"
      - "ansible/tasks/**"
      - "ansible/templates/**"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static matrix with custom SSH secret names
        id: build
        run: |
          python3 << 'PY'
          import yaml
          import json
          import os

          servers_dir = "ansible/data/servers"
          matrix_entries = []

          for filename in os.listdir(servers_dir):
              if not filename.endswith(".yml"):
                  continue

              path = os.path.join(servers_dir, filename)

              with open(path) as f:
                  data = yaml.safe_load(f) or {}

              if data.get("enabled") is False:
                  continue

              server_name = data.get("server_name")
              ssh_secret = data.get("ssh_secret_name")
              public_ip_secret = data.get("public_ip_secret_name")
              ssh_user_secret = data.get("ssh_user_secret_name")

              if (
                  server_name
                  and ssh_secret
                  and public_ip_secret
                  and ssh_user_secret
              ):
                  matrix_entries.append({
                      "server": server_name,
                      "secret_name": ssh_secret,
                      "public_ip_secret_name": public_ip_secret,
                      "ssh_user_secret_name": ssh_user_secret,
                  })

          matrix_json = json.dumps({
              "include": matrix_entries
          })

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={matrix_json}\n")
          PY


  configure:
    needs: generate-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .github/requirements/deploy.txt

      - name: Install Ansible
        run: |
          pip install -r .github/requirements/deploy.txt
          ansible-galaxy collection install 'community.docker:>3.0.0'
          ansible-galaxy collection install community.general

      - name: Configure server
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

          SSH_PRIVATE_KEY: ${{ secrets[matrix.secret_name] }}

          TARGET_SERVER: ${{ matrix.server }}
          TARGET_PUBLIC_IP: ${{ secrets[matrix.public_ip_secret_name] }}
          TARGET_SSH_USER: ${{ secrets[matrix.ssh_user_secret_name] }}

          POSTGRES_PROD_USER: ${{ secrets.POSTGRES_PROD_USER }}
          POSTGRES_PROD_PASSWORD: ${{ secrets.POSTGRES_PROD_PASSWORD }}

          POSTGRES_STAGE_USER: ${{ secrets.POSTGRES_STAGE_USER }}
          POSTGRES_STAGE_PASSWORD: ${{ secrets.POSTGRES_STAGE_PASSWORD }}

          RABBITMQ_PROD_USER: ${{ secrets.RABBITMQ_PROD_USER }}
          RABBITMQ_PROD_PASSWORD: ${{ secrets.RABBITMQ_PROD_PASSWORD }}
          RABBITMQ_STAGE_USER: ${{ secrets.RABBITMQ_STAGE_USER }}
          RABBITMQ_STAGE_PASSWORD: ${{ secrets.RABBITMQ_STAGE_PASSWORD }}

          GRAFANA_PROD_USER: ${{ secrets.GRAFANA_PROD_USER }}
          GRAFANA_PROD_PASSWORD: ${{ secrets.GRAFANA_PROD_PASSWORD }}
          GRAFANA_STAGE_USER: ${{ secrets.GRAFANA_STAGE_USER }}
          GRAFANA_STAGE_PASSWORD: ${{ secrets.GRAFANA_STAGE_PASSWORD }}

          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}

          BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}

        run: |
          echo "Configuring $TARGET_SERVER"

          KEY_FILE=$(mktemp)

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"

          chmod 600 "$KEY_FILE"

          ansible-playbook \
            ansible/playbooks/base-setup.yml \
            --inventory ansible/inventory/dynamic_inventory.py \
            --limit "$TARGET_SERVER" \
            --private-key "$KEY_FILE"

          rm -f "$KEY_FILE"
