name: Deploy App

run-name: Deploy ${{ github.event.client_payload.app_repo || inputs.app_repo }} ${{ github.event.client_payload.env || inputs.env }}

on:
  repository_dispatch:
    types: [deploy-app]
  workflow_dispatch:
    inputs:
      app_repo:
        description: 'Full repo name (for example: dime-consultants/ai_invoicing)'
        required: true
        type: string
      env:
        description: 'Environment'
        required: true
        type: choice
        options:
          - prod
          - stage
      image_tag:
        description: 'Full image tag to deploy'
        required: true
        type: string
      server:
        description: 'Optional target environment name (for example: dime)'
        required: false
        type: string
      docker_compose_b64:
        description: 'Optional base64-encoded docker-compose.yml for Compose apps'
        required: false
        type: string

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      servers: ${{ steps.targets.outputs.servers }}
      servers_json: ${{ steps.targets.outputs.servers_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Build target deploy matrix
        id: targets
        env:
          TARGET_SERVER: ${{ github.event.client_payload.target_server || github.event.client_payload.server || inputs.server }}
        run: |
          python3 ansible/scripts/deployment_resolver.py targets \
            --app "${{ github.event.client_payload.app_repo || inputs.app_repo }}" \
            --env "${{ github.event.client_payload.env || inputs.env }}" \
            --server "$TARGET_SERVER"
            
  deploy:
    name: Deploy ${{ github.event.client_payload.app_repo || inputs.app_repo }} ${{ github.event.client_payload.env || inputs.env }} to ${{ matrix.server }}
    needs: resolve-targets
    if: needs.resolve-targets.outputs.servers != ''
    runs-on: ubuntu-latest
    concurrency:
      group: server-${{ matrix.server }}
      cancel-in-progress: false
    strategy:
      matrix: ${{ fromJson(needs.resolve-targets.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Show infra revision
        run: git rev-parse --short HEAD

      - name: Setup tools
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/requirements/deploy.txt

      - name: Cache Ansible collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('.github/requirements/deploy.txt') }}

      - name: Install dependencies
        run: |
          pip install -r .github/requirements/deploy.txt
          ansible-galaxy collection install 'community.docker:>3.0.0'

      - name: Decode docker-compose.yml
        if: ${{ (github.event.client_payload.docker_compose_b64 || inputs.docker_compose_b64) != null && (github.event.client_payload.docker_compose_b64 || inputs.docker_compose_b64) != '' }}
        run: |
          echo "${{ github.event.client_payload.docker_compose_b64 || inputs.docker_compose_b64 }}" | base64 -d > /tmp/docker-compose-raw.yml

      - name: Create .env file
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag || inputs.image_tag }}
          SHARED_ENV: ${{ github.event.client_payload.env || inputs.env }}
          ENV_VARS_JSON: ${{ toJson(github.event.client_payload.env_vars) }}
          ENV_SECRETS_JSON: ${{ toJson(github.event.client_payload.env_secrets) }}
        run: |
          python3 ansible/scripts/deployment_resolver.py create-env \
            --image-tag "$IMAGE_TAG" \
            --env "$SHARED_ENV" \
            --env-vars-json "$ENV_VARS_JSON" \
            --env-secrets-json "$ENV_SECRETS_JSON" \
            --output /tmp/.env

      - name: Append app environment metadata
        env:
          POSTGRES_PROD_USER: ${{ secrets.POSTGRES_PROD_USER }}
          POSTGRES_PROD_PASSWORD: ${{ secrets.POSTGRES_PROD_PASSWORD }}
          POSTGRES_STAGE_USER: ${{ secrets.POSTGRES_STAGE_USER }}
          POSTGRES_STAGE_PASSWORD: ${{ secrets.POSTGRES_STAGE_PASSWORD }}
          APP_DATABASE_HOST: 138.197.114.62
          APP_DATABASE_PORT: "5432"
          APP_DATABASE_USER: root
          APP_DATABASE_PASSWORD: ${{ secrets.APP_DATABASE_PASSWORD || secrets.POSTGRES_PROD_PASSWORD }}
          RABBITMQ_PROD_USER: ${{ secrets.RABBITMQ_PROD_USER }}
          RABBITMQ_PROD_PASSWORD: ${{ secrets.RABBITMQ_PROD_PASSWORD }}
          RABBITMQ_STAGE_USER: ${{ secrets.RABBITMQ_STAGE_USER }}
          RABBITMQ_STAGE_PASSWORD: ${{ secrets.RABBITMQ_STAGE_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          TARGET_PUBLIC_IP: ${{ secrets[format('{0}', matrix.public_ip_secret_name)] }}
        run: |
          python3 ansible/scripts/deployment_resolver.py env \
            --app "${{ github.event.client_payload.app_repo || inputs.app_repo }}" \
            --env "${{ github.event.client_payload.env || inputs.env }}" \
            --target-server "${{ matrix.server }}" \
            --output /tmp/.env \
            --append

      - name: Render final docker-compose
        if: ${{ (github.event.client_payload.docker_compose_b64 || inputs.docker_compose_b64) != null && (github.event.client_payload.docker_compose_b64 || inputs.docker_compose_b64) != '' }}
        run: |
          docker compose -f /tmp/docker-compose-raw.yml --env-file /tmp/.env config > /tmp/docker-compose.yml

      - name: Deploy app
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_TIMEOUT: "15"
          ANSIBLE_SSH_ARGS: >-
            -o ConnectTimeout=10
            -o ConnectionAttempts=1
            -o BatchMode=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=2
          SSH_PRIVATE_KEY: ${{ secrets[format('{0}', matrix.secret_name)] }}
          TARGET_SERVER: ${{ matrix.server }}
          TARGET_PUBLIC_IP: ${{ secrets[format('{0}', matrix.public_ip_secret_name)] }}
          TARGET_SSH_USER: ${{ secrets[format('{0}', matrix.ssh_user_secret_name)] }}
          POSTGRES_PROD_USER: ${{ secrets.POSTGRES_PROD_USER }}
          POSTGRES_PROD_PASSWORD: ${{ secrets.POSTGRES_PROD_PASSWORD }}
          POSTGRES_STAGE_USER: ${{ secrets.POSTGRES_STAGE_USER }}
          POSTGRES_STAGE_PASSWORD: ${{ secrets.POSTGRES_STAGE_PASSWORD }}
          APP_DATABASE_HOST: 138.197.114.62
          APP_DATABASE_PORT: "5432"
          APP_DATABASE_USER: root
          APP_DATABASE_PASSWORD: ${{ secrets.APP_DATABASE_PASSWORD || secrets.POSTGRES_PROD_PASSWORD }}
          RABBITMQ_PROD_USER: ${{ secrets.RABBITMQ_PROD_USER }}
          RABBITMQ_PROD_PASSWORD: ${{ secrets.RABBITMQ_PROD_PASSWORD }}
          RABBITMQ_STAGE_USER: ${{ secrets.RABBITMQ_STAGE_USER }}
          RABBITMQ_STAGE_PASSWORD: ${{ secrets.RABBITMQ_STAGE_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |

          # Write key to a temp file
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"

          app_name=$(basename "${{ github.event.client_payload.app_repo || inputs.app_repo }}")
          env="${{ github.event.client_payload.env || inputs.env }}"
          echo "Deploying $app_name ($env) to ${{ matrix.server }}"
          ansible-playbook ansible/playbooks/deploy-app.yml \
            --inventory ansible/inventory/dynamic_inventory.py \
            --extra-vars "target_server=${{ matrix.server }}" \
            --extra-vars "app_name=$app_name" \
            --extra-vars "app_repo=${{ github.event.client_payload.app_repo || inputs.app_repo }}" \
            --extra-vars "env=$env" \
            --extra-vars "compose_file=/tmp/docker-compose.yml" \
            --extra-vars "env_file=/tmp/.env" \
            --extra-vars "image_tag=${{ github.event.client_payload.image_tag || inputs.image_tag }}" \
            --timeout 15 \
            --private-key "$KEY_FILE"
