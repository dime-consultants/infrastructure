---
- name: Deploy or update application
  hosts: "{{ target_server }}"
  become: yes
  vars:
    app_dir: "/opt/{{ app_name }}/{{ env }}"
  tasks:
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy rendered docker-compose.yml
      copy:
        src: "{{ compose_file }}"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Copy .env file
      copy:
        src: "{{ env_file }}"
        dest: "{{ app_dir }}/.env"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Force image tag override (for rollback)
      lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: '^IMAGE_TAG='
        line: "IMAGE_TAG={{ force_image_tag | default(omit) }}"
      when: force_image_tag is defined

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        project_name: "{{ app_name }}_{{ env | default('prod') }}"
        files:
          - docker-compose.yml
        env_files:
          - .env
        state: present
        pull: always
        recreate: always
        remove_orphans: true
        remove_volumes: false
        dependencies: true
        wait: true
        wait_timeout: 300
      register: compose_output
      changed_when: true

    - name: Post-deploy cleanup – remove unused Docker data
      ansible.builtin.command: >
        docker system prune -af
      register: docker_prune_output
      changed_when: "'Total reclaimed space' in docker_prune_output.stdout"

    - name: Post-deploy cleanup – remove Docker build cache
      ansible.builtin.command: >
        docker builder prune -af
      register: docker_builder_prune_output
      changed_when: "'Total reclaimed space' in docker_builder_prune_output.stdout"
