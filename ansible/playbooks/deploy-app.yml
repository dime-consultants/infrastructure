---
- name: Deploy or update application
  hosts: "{{ target_server }}"
  become: yes
  vars_files:
    - ../data/shared-services.yml
  vars:
    requested_app_identifiers:
      - "{{ app_repo | default('') | lower }}"
      - "{{ app_name | default('') | lower }}"
      - "{{ (app_repo | default('') | basename | regex_replace('\\.git$', '')) | lower }}"
  tasks:
    - name: Resolve app deployment config
      set_fact:
        deployment_app: "{{ item }}"
        deployment_app_env: "{{ item | combine(item.environments[env], recursive=True) }}"
      loop: "{{ apps | default([]) }}"
      vars:
        deployment_app_identifiers: >-
          {{
            (
              [item.name | default(''), item.repo | default(''), (item.repo | default('') | basename | regex_replace('\.git$', ''))]
              + (item.aliases | default([]))
            )
            | map('lower')
            | list
          }}
      when:
        - item.environments is defined
        - env in item.environments
        - (requested_app_identifiers | intersect(deployment_app_identifiers) | length) > 0

    - name: Validate app deployment config
      assert:
        that:
          - deployment_app is defined
          - deployment_app_env is defined
        fail_msg: "No app config found for {{ app_repo | default(app_name) }}:{{ env }} on {{ target_server }}."

    - name: Resolve application directory
      set_fact:
        app_dir: "/opt/{{ deployment_app.name }}/{{ env }}"

    - name: Resolve Postgres subscription
      set_fact:
        postgres_subscription: "{{ shared_services | default([]) | selectattr('name', 'equalto', 'postgres') | first | default({}) }}"
      when: deployment_app_env.postgres_database is defined

    - name: Validate Postgres shared service catalog
      assert:
        that:
          - env in shared_service_catalog.postgres.environments
        fail_msg: "Shared service catalog has no postgres:{{ env }} config required by {{ deployment_app.name }}."
      when: deployment_app_env.postgres_database is defined

    - name: Provision app Postgres database
      include_tasks: ../tasks/provision-postgres-database.yml
      vars:
        shared_service_name: postgres
        shared_service_env: "{{ env }}"
        shared_service_env_config: "{{ shared_service_catalog.postgres.environments[env] }}"
        postgres_app: "{{ deployment_app }}"
        postgres_app_env: "{{ deployment_app_env }}"
        postgres_secret_names: >-
          {{
            (postgres_subscription.environments | default({}))
            .get(env, {})
            .get('secret_names', shared_service_catalog.postgres.environments[env].secret_names | default({}))
          }}
      when: deployment_app_env.postgres_database is defined

    - name: Resolve RabbitMQ subscription
      set_fact:
        rabbitmq_subscription: "{{ shared_services | default([]) | selectattr('name', 'equalto', 'rabbitmq') | first | default({}) }}"
      when: deployment_app_env.rabbitmq_namespace is defined

    - name: Validate RabbitMQ shared service catalog
      assert:
        that:
          - env in shared_service_catalog.rabbitmq.environments
        fail_msg: "Shared service catalog has no rabbitmq:{{ env }} config required by {{ deployment_app.name }}."
      when: deployment_app_env.rabbitmq_namespace is defined

    - name: Provision app RabbitMQ namespace
      include_tasks: ../tasks/provision-rabbitmq-namespace.yml
      vars:
        shared_service_name: rabbitmq
        shared_service_env: "{{ env }}"
        rabbitmq_app: "{{ deployment_app }}"
        rabbitmq_app_env: "{{ deployment_app_env }}"
        rabbitmq_secret_names: >-
          {{
            (rabbitmq_subscription.environments | default({}))
            .get(env, {})
            .get('secret_names', shared_service_catalog.rabbitmq.environments[env].secret_names | default({}))
          }}
      when: deployment_app_env.rabbitmq_namespace is defined

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy rendered docker-compose.yml
      copy:
        src: "{{ compose_file }}"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: '0644'
      when: compose_file is defined

    - name: Copy .env file
      copy:
        src: "{{ env_file }}"
        dest: "{{ app_dir }}/.env"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      when: env_file is defined

    - name: Force image tag override (for rollback)
      lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: '^IMAGE_TAG='
        line: "IMAGE_TAG={{ force_image_tag | default(omit) }}"
      when: force_image_tag is defined

    - name: Stop and remove existing stack
      community.docker.docker_compose_v2:
          project_src: "{{ app_dir }}"
          project_name: "{{ app_name }}_{{ env | default('prod') }}"
          state: absent
          remove_volumes: false
          remove_orphans: true

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        project_name: "{{ app_name }}_{{ env | default('prod') }}"
        files:
          - docker-compose.yml
        env_files:
          - .env
        state: present
        pull: always
        recreate: always
        remove_orphans: true
        remove_volumes: false
        dependencies: true
        wait: true
        wait_timeout: 300
      register: compose_output
      changed_when: true

    - name: Post-deploy cleanup – remove unused Docker data
      ansible.builtin.command: >
        docker system prune -af
      register: docker_prune_output
      changed_when: "'Total reclaimed space' in docker_prune_output.stdout"

    - name: Post-deploy cleanup – remove Docker build cache
      ansible.builtin.command: >
        docker builder prune -af
      register: docker_builder_prune_output
      changed_when: "'Total reclaimed space' in docker_builder_prune_output.stdout"
