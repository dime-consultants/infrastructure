---
- name: Deploy or update application
  hosts: "{{ target_server }}"
  become: yes
  gather_facts: false
  vars_files:
    - ../data/common.yml
    - ../data/shared-services.yml
  vars:
    requested_app_identifiers:
      - "{{ app_repo | default('') | lower }}"
      - "{{ app_name | default('') | lower }}"
      - "{{ (app_repo | default('') | basename | regex_replace('\\.git$', '')) | lower }}"
  pre_tasks:
    - name: Wait for SSH to become reachable
      wait_for_connection:
        delay: "{{ ssh_wait_delay | default(5) }}"
        timeout: "{{ ssh_wait_timeout | default(180) }}"

  tasks:
    - name: Resolve app deployment config
      set_fact:
        deployment_app: "{{ item }}"
        deployment_app_env: "{{ item | combine(item.environments[env], recursive=True) }}"
      loop: "{{ apps | default([]) }}"
      vars:
        deployment_app_identifiers: >-
          {{
            (
              [item.name | default(''), item.repo | default(''), (item.repo | default('') | basename | regex_replace('\.git$', ''))]
              + (item.aliases | default([]))
            )
            | map('lower')
            | list
          }}
      when:
        - item.environments is defined
        - env in item.environments
        - (requested_app_identifiers | intersect(deployment_app_identifiers) | length) > 0

    - name: Validate app deployment config
      assert:
        that:
          - deployment_app is defined
          - deployment_app_env is defined
        fail_msg: "No app config found for {{ app_repo | default(app_name) }}:{{ env }} on {{ target_server }}."

    - name: Resolve application directory
      set_fact:
        app_dir: "/opt/{{ deployment_app.name }}/{{ env }}"
        deployment_runtime: "{{ deployment_app_env.deployment_type | default(deployment_app_env.runtime | default('compose')) }}"

    - name: Calculate max disk usage before deployment
      shell: |
        set -eu
        df -P / /var/lib/docker |
          awk 'NR > 1 { gsub("%", "", $5); if ($5 > max) max=$5 } END { print max + 0 }'
      register: max_disk_usage_before_deploy
      changed_when: false
      when: deployment_runtime == 'compose'

    - name: Pre-deploy Docker maintenance and disk check
      include_tasks: ../tasks/configure-docker-maintenance.yml
      vars:
        docker_maintenance_configure_daemon: false
      when: >-
        deployment_runtime == 'compose' and
        deployment_app_env.deploy_maintenance | default(true) | bool and
        (
          deployment_app_env.force_deploy_maintenance | default(false) | bool or
          max_disk_usage_before_deploy.stdout | int >= docker_maintenance.cleanup_min_disk_use_percent | default(85) | int
        )

    - name: Validate Postgres shared service catalog
      assert:
        that:
          - env in shared_service_catalog.postgres.environments
        fail_msg: "Shared service catalog has no postgres:{{ env }} config required by {{ deployment_app.name }}."
      when: deployment_app_env.postgres_database is defined

    - name: Validate RabbitMQ shared service catalog
      assert:
        that:
          - env in shared_service_catalog.rabbitmq.environments
        fail_msg: "Shared service catalog has no rabbitmq:{{ env }} config required by {{ deployment_app.name }}."
      when: deployment_app_env.rabbitmq_namespace is defined

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy rendered docker-compose.yml
      copy:
        src: "{{ compose_file }}"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: '0644'
      when:
        - deployment_runtime == 'compose'
        - compose_file is defined

    - name: Copy .env file
      copy:
        src: "{{ env_file }}"
        dest: "{{ app_dir }}/.env"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      when:
        - deployment_runtime == 'compose'
        - env_file is defined

    - name: Remove stale deploy artifacts
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ deployment_app_env.remove_deploy_artifacts | default([]) }}"

    - name: Validate Compose deployment artifact
      assert:
        that:
          - compose_file is defined
        fail_msg: "Compose deployments require compose_file. Set deployment_type: helm for K3s/Helm apps."
      when: deployment_runtime == 'compose'

    - name: Force image tag override (for rollback)
      lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: '^IMAGE_TAG='
        line: "IMAGE_TAG={{ force_image_tag | default(omit) }}"
      when:
        - deployment_runtime == 'compose'
        - force_image_tag is defined

    - name: Stop and remove existing stack
      community.docker.docker_compose_v2:
          project_src: "{{ app_dir }}"
          project_name: "{{ app_name }}_{{ env | default('prod') }}"
          state: absent
          remove_volumes: false
          remove_orphans: true
      when:
        - deployment_runtime == 'compose'
        - deployment_app_env.stop_before_deploy | default(false) | bool

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        project_name: "{{ app_name }}_{{ env | default('prod') }}"
        files:
          - docker-compose.yml
        env_files:
          - .env
        state: present
        pull: "{{ deployment_app_env.compose_pull | default('always') }}"
        recreate: "{{ deployment_app_env.compose_recreate | default('always') }}"
        remove_orphans: true
        remove_volumes: false
        dependencies: true
        wait: true
        wait_timeout: "{{ deployment_app_env.compose_wait_timeout | default(300) }}"
      register: compose_output
      changed_when: true
      when: deployment_runtime == 'compose'

    - name: Deploy with Helm on K3s
      include_tasks: ../tasks/deploy-helm-app.yml
      when: deployment_runtime in ['helm', 'k3s']

    - name: Post-deploy Docker maintenance and disk check
      include_tasks: ../tasks/configure-docker-maintenance.yml
      vars:
        docker_maintenance_configure_daemon: false
      when:
        - deployment_runtime == 'compose'
        - deployment_app_env.post_deploy_maintenance | default(false) | bool
