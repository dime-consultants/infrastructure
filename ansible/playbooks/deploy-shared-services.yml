---
- name: Deploy shared services
  hosts: "{{ target_server | default('all') }}"
  become: yes

  vars_files:
    - ../data/shared-services.yml

  tasks:
    - name: Deploy subscribed shared services
      include_tasks: ../tasks/deploy-shared-service-subscription.yml
      loop: "{{ shared_services | default([]) }}"
      loop_control:
        loop_var: shared_service_subscription_item
        label: "{{ shared_service_subscription_item.name }}"
      vars:
        shared_service_subscription: "{{ shared_service_subscription_item }}"

    - name: Provision app databases and broker namespaces
      include_tasks: ../tasks/provision-app-shared-dependencies.yml
