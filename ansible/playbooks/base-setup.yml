---
- name: Base server setup and Nginx config
  hosts: all
  become: yes
  gather_facts: false

  vars_files:
    - ../config/global/common.yml
    - ../config/shared-services/catalog.yml

  pre_tasks:
    - name: Wait for SSH to become reachable
      wait_for_connection:
        delay: "{{ ssh_wait_delay | default(5) }}"
        timeout: "{{ ssh_wait_timeout | default(180) }}"

    - name: Gather facts
      setup:

    - name: Gather service facts
      service_facts:

  tasks:
    - name: Resolve host routing mode
      set_fact:
        effective_nginx_enabled: "{{ nginx_enabled | default(not (k3s.enabled | default(false) | bool)) | bool }}"

    - name: Resolve routes that still require host Nginx
      set_fact:
        host_nginx_route_blockers_json: >-
          {%- set blockers = [] -%}
          {%- for app in apps | default([]) -%}
          {%- if app.environments is mapping -%}
          {%- for env_name, env_options in app.environments.items() -%}
          {%- set merged_env = app | combine(env_options | default({}), recursive=True) -%}
          {%- set runtime = merged_env.deployment_type | default(merged_env.runtime | default('compose')) -%}
          {%- if env_options.domain is defined and (runtime not in ['helm', 'k3s'] or merged_env.nginx_managed | default(runtime == 'compose')) -%}
          {%- set _ = blockers.append(app.name ~ ':' ~ env_name ~ ' (' ~ env_options.domain ~ ')') -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endfor -%}
          {%- for domain_options in extra_domains | default([]) -%}
          {%- if domain_options.domain is defined -%}
          {%- set _ = blockers.append('extra_domain:' ~ domain_options.domain) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- for service in shared_services | default([]) -%}
          {%- if service.environments is mapping -%}
          {%- for env_name, env_options in service.environments.items() -%}
          {%- if env_options.domain is defined -%}
          {%- set _ = blockers.append('shared_service:' ~ service.name ~ ':' ~ env_name ~ ' (' ~ env_options.domain ~ ')') -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endfor -%}
          {{ blockers | to_json }}

    - name: Parse host Nginx route blockers
      set_fact:
        host_nginx_route_blockers: "{{ host_nginx_route_blockers_json | from_json }}"

    - name: Refuse to disable Nginx while routes still depend on it
      assert:
        that:
          - host_nginx_route_blockers | length == 0
        fail_msg: >-
          K3s is configured to own ports 80/443 and host Nginx would be disabled,
          but these routes still depend on host Nginx: {{ host_nginx_route_blockers | join(', ') }}.
          Migrate apps to deployment_type: helm with nginx_managed: false and ingress.enabled: true,
          or set nginx_enabled: true until migration is complete.
      when:
        - k3s.enabled | default(false) | bool
        - not (effective_nginx_enabled | bool)
        - not (k3s.external_routes_enabled | default(true) | bool)

    - name: Remove previously managed Docker apt repository
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/docker.sources
      when: docker_setup_enabled | default(true) | bool

    - name: Update apt cache
      command: apt-get update
      register: apt_update_result
      changed_when: false
      retries: 5
      delay: 10
      until: apt_update_result.rc == 0

    - name: Resolve Docker apt repository settings
      set_fact:
        docker_apt_platform: "{{ ansible_facts['distribution'] | lower }}"
        docker_apt_arch: >-
          {{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else
             'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else
             ansible_facts['architecture'] }}
      when: docker_setup_enabled | default(true) | bool

    - name: Validate Docker apt repository platform
      assert:
        that:
          - docker_apt_platform in ['debian', 'ubuntu']
        fail_msg: "Docker apt repository setup supports Debian and Ubuntu, not {{ ansible_facts['distribution'] }}."
      when: docker_setup_enabled | default(true) | bool

    - name: Install dependencies for adding Docker repo
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
      when: docker_setup_enabled | default(true) | bool

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: docker_setup_enabled | default(true) | bool

    - name: Download Docker official GPG key
      get_url:
        url: "https://download.docker.com/linux/{{ docker_apt_platform }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      when: docker_setup_enabled | default(true) | bool

    - name: Set permissions on Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.asc
        mode: '0644'
      when: docker_setup_enabled | default(true) | bool

    - name: Add Docker official repository
      copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/{{ docker_apt_platform }}
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Architectures: {{ docker_apt_arch }}
          Signed-By: /etc/apt/keyrings/docker.asc
      when: docker_setup_enabled | default(true) | bool

    - name: Update apt cache after adding Docker repository
      command: apt-get update
      register: docker_apt_update_result
      changed_when: false
      retries: 5
      delay: 10
      until: docker_apt_update_result.rc == 0
      when: docker_setup_enabled | default(true) | bool

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: docker_setup_enabled | default(true) | bool

    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes
      when: docker_setup_enabled | default(true) | bool

    - name: Configure Docker maintenance and reclaim disk space
      include_tasks: ../tasks/docker/configure-docker-maintenance.yml
      when: docker_setup_enabled | default(true) | bool

    - name: Add current user to docker group
      user:
        name: "{{ ansible_user | default('ubuntu') }}"
        groups: docker
        append: yes
      when: docker_setup_enabled | default(true) | bool

    - name: Install common packages
      apt:
        name: "{{ common_packages }}"
        state: present

    - name: Install Nginx packages
      apt:
        name: "{{ nginx_packages }}"
        state: present
      when: effective_nginx_enabled | bool

    - name: Install and configure K3s
      include_tasks: ../tasks/kubernetes/install-k3s.yml
      when: k3s.enabled | default(false) | bool

    - name: Reconcile configured K3s app replica counts
      include_tasks: ../tasks/kubernetes/reconcile-app-replicas.yml
      when: k3s.enabled | default(false) | bool

    - name: Deploy K3s Portainer dashboard
      include_tasks: ../tasks/kubernetes/deploy-portainer.yml
      when:
        - k3s.enabled | default(false) | bool
        - k3s_portainer.enabled | default(false) | bool

    - name: Deploy K3s Grafana dashboard
      include_tasks: ../tasks/kubernetes/deploy-grafana.yml
      when:
        - k3s.enabled | default(false) | bool
        - k3s_grafana.enabled | default(false) | bool

    - name: Deploy K3s Argo CD
      include_tasks: ../tasks/kubernetes/deploy-argocd.yml
      when:
        - k3s.enabled | default(false) | bool
        - k3s_argocd.enabled | default(false) | bool

    - name: Deploy K3s external routes for host-port services
      include_tasks: ../tasks/kubernetes/deploy-external-routes.yml
      vars:
        extra_domains: "{{ hostvars[inventory_hostname].extra_domains | default([]) }}"
        shared_services: "{{ hostvars[inventory_hostname].shared_services | default([]) }}"
      when:
        - k3s.enabled | default(false) | bool
        - not (effective_nginx_enabled | bool)
        - k3s.external_routes_enabled | default(true) | bool

    - name: Ensure all K3s ingresses use Let's Encrypt certificates
      include_tasks: ../tasks/kubernetes/ensure-letsencrypt-ingresses.yml
      when:
        - k3s.enabled | default(false) | bool
        - k3s.traefik_acme.enabled | default(false) | bool
        - "'traefik' not in (k3s.disable | default([]))"

    - name: Stop and disable host Nginx when Kubernetes owns HTTP ports
      service:
        name: nginx
        state: stopped
        enabled: false
      register: nginx_disable_result
      when:
        - not (effective_nginx_enabled | bool)
        - "'nginx.service' in ansible_facts.services"

    - name: Restart Traefik service load balancer pods after Nginx state changed
      command: >
        /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
        -n kube-system delete pod
        -l svccontroller.k3s.cattle.io/svcname=traefik
        --ignore-not-found=true
      changed_when: true
      when:
        - k3s.enabled | default(false) | bool
        - not (effective_nginx_enabled | bool)
        - "'traefik' not in (k3s.disable | default([]))"
        - nginx_disable_result is defined
        - nginx_disable_result.changed | default(false)

    - name: Wait for K3s ingress HTTP port after Nginx is disabled
      wait_for:
        host: 127.0.0.1
        port: 80
        timeout: 90
      when:
        - k3s.enabled | default(false) | bool
        - not (effective_nginx_enabled | bool)
        - "'traefik' not in (k3s.disable | default([]))"

    - name: Wait for K3s ingress HTTPS port after Nginx is disabled
      wait_for:
        host: 127.0.0.1
        port: 443
        timeout: 90
      when:
        - k3s.enabled | default(false) | bool
        - not (effective_nginx_enabled | bool)
        - "'traefik' not in (k3s.disable | default([]))"

    - name: Cleanup Nginx and Docker runtime after K3s is ready
      include_tasks: ../tasks/docker/cleanup-for-k3s.yml
      when:
        - k3s.enabled | default(false) | bool
        - not (effective_nginx_enabled | bool)
        - >
          migration_cleanup.purge_nginx_when_k3s | default(false) | bool or
          migration_cleanup.stop_docker_when_k3s | default(false) | bool or
          migration_cleanup.disable_docker_when_k3s | default(false) | bool

    - name: Cleanup K3s and Docker artifacts when switching back to Docker
      include_tasks: ../tasks/docker/cleanup-for-docker.yml
      when:
        - not (k3s.enabled | default(false) | bool)
        - effective_nginx_enabled | bool
        - >
          migration_cleanup.uninstall_k3s_when_docker | default(false) | bool or
          migration_cleanup.docker_prune_when_docker | default(false) | bool or
          migration_cleanup.docker_prune_images_when_docker | default(false) | bool or
          migration_cleanup.docker_prune_volumes_when_docker | default(false) | bool

    - name: Configure security baseline
      include_tasks: ../tasks/security/configure-security.yml

    - name: Deploy subscribed shared services
      include_tasks: ../tasks/shared-services/deploy-shared-service-subscription.yml
      loop: "{{ shared_services | default([]) }}"
      loop_control:
        loop_var: shared_service_subscription_item
        label: "{{ shared_service_subscription_item.name }}"
      vars:
        shared_service_subscription: "{{ shared_service_subscription_item }}"
      when: shared_services_deploy_enabled | default(true) | bool

    - name: Stop unsubscribed shared services
      include_tasks: ../tasks/shared-services/cleanup-unsubscribed-shared-services.yml
      when: shared_services_deploy_enabled | default(true) | bool

    - name: Configure backups
      include_tasks: ../tasks/backups/configure-backups.yml

    - name: Enable and configure UFW
      ufw:
        state: enabled
        policy: deny

    - name: Allow essential ports
      ufw:
        rule: allow
        port: "{{ item }}"
      loop:
        - 22
        - 80
        - 443

    - name: Allow server-specific extra ports
      ufw:
        rule: allow
        port: "{{ item }}"
      loop: "{{ firewall_extra_ports | default([]) }}"

    - name: Create web root for certbot
      file:
        path: "{{ (certbot | default({})).webroot | default('/var/www/letsencrypt') }}"
        state: directory
        mode: '0755'
      when: effective_nginx_enabled | bool

    - name: Resolve Nginx basic auth credentials
      set_fact:
        basic_auth_username: "{{ lookup('env', 'BASIC_AUTH_USERNAME') }}"
        basic_auth_password: "{{ lookup('env', 'BASIC_AUTH_PASSWORD') }}"
      when: effective_nginx_enabled | bool

    - name: Resolve domains requiring Nginx basic auth
      set_fact:
        basic_auth_domains_json: >-
          {%- set auth = namespace(domains=[]) -%}
          {%- for service in shared_services | default([]) -%}
          {%- if service.environments is mapping -%}
          {%- for env_name, env_options in service.environments.items() -%}
          {%- if env_options.basic_auth | default(false) and env_options.domain is defined -%}
          {%- set _ = auth.domains.append(env_options.domain) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endfor -%}
          {%- for domain_options in extra_domains | default([]) -%}
          {%- if domain_options.basic_auth | default(false) and domain_options.domain is defined -%}
          {%- set _ = auth.domains.append(domain_options.domain) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ auth.domains | to_json }}
      when: effective_nginx_enabled | bool

    - name: Parse domains requiring Nginx basic auth
      set_fact:
        basic_auth_domains: "{{ basic_auth_domains_json | from_json }}"
      when: effective_nginx_enabled | bool

    - name: Validate Nginx basic auth credentials
      assert:
        that:
          - basic_auth_username | length > 0
          - basic_auth_password | length > 0
        fail_msg: >-
          BASIC_AUTH_USERNAME and BASIC_AUTH_PASSWORD GitHub Secrets are required
          because these domains use basic_auth: {{ basic_auth_domains | join(', ') }}.
      when:
        - effective_nginx_enabled | bool
        - basic_auth_domains | length > 0

    - name: Install htpasswd utility
      apt:
        name: apache2-utils
        state: present
      when:
        - effective_nginx_enabled | bool
        - basic_auth_domains | default([]) | length > 0

    - name: Create or update .htpasswd file with basic auth credentials
      community.general.htpasswd:
        path: /etc/nginx/.htpasswd
        name: "{{ basic_auth_username }}"
        password: "{{ basic_auth_password }}"
        owner: root
        group: www-data
        mode: '0640'
        state: present
      when:
        - effective_nginx_enabled | bool
        - basic_auth_domains | length > 0

    - name: Generate Nginx sites for all apps and environments
      include_tasks: ../tasks/nginx/generate-nginx.yml
      vars:
        apps: "{{ hostvars[inventory_hostname].apps | default([]) }}"
        extra_domains: "{{ hostvars[inventory_hostname].extra_domains | default([]) }}"
        shared_services: "{{ hostvars[inventory_hostname].shared_services | default([]) }}"
      when: effective_nginx_enabled | bool

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded

    - name: Restart Fail2Ban
      service:
        name: fail2ban
        state: restarted

    - name: Restart SSH
      service:
        name: "{{ 'ssh' if 'ssh.service' in ansible_facts.services else 'sshd' }}"
        state: restarted

    - name: Restart Docker
      service:
        name: docker
        state: restarted

    - name: Restart K3s
      service:
        name: k3s
        state: restarted
