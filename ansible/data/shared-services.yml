---
# Shared services are deployed as standalone Docker Compose projects.
# Servers opt in with `shared_services` in ansible/data/servers/*.yml.
shared_service_base_dir: /opt/shared-services
shared_service_environments:
  - prod
  - stage

shared_service_networks:
  prod: shared-prod
  stage: shared-stage

shared_service_catalog:
  postgres:
    description: PostgreSQL database server
    compose_file: ../shared-services/postgres/docker-compose.yml
    environments:
      prod:
        published_port: 5432
        network: shared-prod
        volume: shared_postgres_prod_data
        service_host: postgres
        secret_names:
          username: POSTGRES_PROD_USER
          password: POSTGRES_PROD_PASSWORD
      stage:
        published_port: 5433
        network: shared-stage
        volume: shared_postgres_stage_data
        service_host: postgres
        secret_names:
          username: POSTGRES_STAGE_USER
          password: POSTGRES_STAGE_PASSWORD

