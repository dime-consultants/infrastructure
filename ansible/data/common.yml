common_packages:
  - ufw
  - python3-docker
  - fail2ban
  - unattended-upgrades

nginx_packages:
  - nginx
  - certbot
  - python3-certbot-nginx

security_baseline:
  unattended_upgrades: true
  fail2ban: true

docker_maintenance:
  log_max_size: 20m
  log_max_file: "5"
  journal_vacuum_time: 14d
  temp_file_min_age_days: 2
  max_disk_use_percent: 90

backup_defaults:
  enabled: false
  repository_secret_name: RESTIC_REPOSITORY
  password_secret_name: RESTIC_PASSWORD
  schedule: "*-*-* 02:30:00"
  randomized_delay_sec: "30m"
  retention:
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6
  paths:
    - /opt
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
    - /etc/letsencrypt
  postgres:
    enabled: true

load_balancing_defaults:
  method: round_robin
  max_fails: 3
  fail_timeout: 30s

k3s:
  enabled: false
  channel: stable
  install_script_url: https://get.k3s.io
  kubeconfig_path: /etc/rancher/k3s/k3s.yaml
  write_kubeconfig_mode: "0644"
  disable: []
  install_helm: true
  helm_install_script_url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
  firewall_ports:
    - 80
    - 443
    - 6443
