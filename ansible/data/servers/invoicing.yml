server_name: invoicing

ssh_secret_name: INVOICING_SSH_KEY
ssh_user_secret_name: INVOICING_SSH_USER
public_ip_secret_name: INVOICING_PUBLIC_IP

ansible_timeout: 15
ssh_wait_delay: 0
ssh_wait_timeout: 45

ansible_ssh_common_args: >-
  -o ConnectTimeout=10
  -o ConnectionAttempts=1
  -o BatchMode=yes
  -o ServerAliveInterval=30
  -o ServerAliveCountMax=2

docker_setup_enabled: false
shared_services_deploy_enabled: false
nginx_enabled: false

migration_cleanup:
  purge_nginx_when_k3s: true
  stop_docker_when_k3s: true
  disable_docker_when_k3s: false
  uninstall_k3s_when_docker: false
  docker_prune_when_docker: false
  docker_prune_volumes_when_docker: false
  docker_prune_images_when_docker: false

k3s:
  enabled: true
  disable: []
  install_helm: true
  traefik_acme:
    enabled: true
    resolver_name: letsencrypt
    storage: /data/acme.json
  firewall_ports:
    - 80
    - 443
    - 6443

firewall_extra_ports: []

docker_maintenance:
  cleanup_min_disk_use_percent: 88
  journal_vacuum_size: 300M

shared_services:
  - name: postgres
    environments:
      prod: {}
      stage: {}

  - name: portainer
    environments:
      prod:
        domain: portainer.dimeconsultants.africa

  - name: grafana
    environments:
      prod:
        domain: grafana.dimeconsultants.africa

  - name: rabbitmq
    environments:
      prod:
        domain: rabbitmq.dimeconsultants.africa
      stage: {}

apps:
  - name: invoicing
    repo: dime-consultants/ai_invoicing
    deployment_type: helm
    aliases:
      - ai_invoicing
      - invoicing.dimeconsultants.africa
      - stage-invoicing.dimeconsultants.africa
    port_env: API_PORT
    postgres_database: invoicing
    rabbitmq_namespace: invoicing
    remove_deploy_artifacts:
      - /root/tools/ai_invoicing/image.tar
    compose_pull: missing
    compose_recreate: auto
    compose_wait_timeout: 120
    environments:
      prod:
        domain: invoicing.dimeconsultants.africa
        nginx_managed: false
        port: 9455
        container_port: 9455
        service:
          type: ClusterIP
          port: 80
          targetPort: 9455
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
          tls:
            enabled: true
        helm:
          namespace: prod
      stage:
        domain: stage-invoicing.dimeconsultants.africa
        nginx_managed: false
        port: 6001
        container_port: 6001
        service:
          type: ClusterIP
          port: 80
          targetPort: 6001
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
          tls:
            enabled: true
        helm:
          namespace: stage

  - name: hrpayroll
    repo: dime-consultants/hrpayroll
    deployment_type: helm
    aliases:
      - hrpayroll
      - hr.dimeconsultants.africa
      - stage-hr.dimeconsultants.africa
    port_env: API_PORT
    postgres_database: hr
    rabbitmq_namespace: hr
    remove_deploy_artifacts:
      - /root/tools/hrpayroll/image.tar
    compose_pull: missing
    compose_recreate: auto
    compose_wait_timeout: 120
    environments:
      prod:
        domain: hr.dimeconsultants.africa
        nginx_managed: false
        port: 8023
        container_port: 8023
        service:
          type: ClusterIP
          port: 80
          targetPort: 8023
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
          tls:
            enabled: true
        helm:
          namespace: prod
      stage:
        domain: stage-hr.dimeconsultants.africa
        nginx_managed: false
        port: 7734
        container_port: 7734
        service:
          type: ClusterIP
          port: 80
          targetPort: 7734
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
          tls:
            enabled: true
        helm:
          namespace: stage

  - name: guardian
    repo: dime-consultants/Guardian-Bank-UI
    deployment_type: helm
    aliases:
      - guardian
      - dime-consultants/guardian
      - guardian.dimeconsultants.africa
      - stage-guardian.dimeconsultants.africa
    port_env: API_PORT
    environments:
      prod:
        domain: guardian.dimeconsultants.africa
        nginx_managed: false
        port: 3004
        container_port: 3004
        service:
          type: ClusterIP
          port: 80
          targetPort: 3004
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
          tls:
            enabled: true
        helm:
          namespace: prod
      stage:
        domain: stage-guardian.dimeconsultants.africa
        nginx_managed: false
        port: 3005
        container_port: 3005
        service:
          type: ClusterIP
          port: 80
          targetPort: 3005
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
          tls:
            enabled: true
        helm:
          namespace: stage

extra_domains:
  - domain: promtail.dimeconsultants.africa
    proxy_port: 9080
    basic_auth: true

  - domain: argocd.dimeconsultants.africa
    proxy_port: 8080
    preserve_authorization: true

backups:
  enabled: false
