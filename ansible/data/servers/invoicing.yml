server_name: invoicing
ssh_secret_name: INVOICING_SSH_KEY
ssh_user_secret_name: INVOICING_SSH_USER
public_ip_secret_name: INVOICING_PUBLIC_IP

firewall_extra_ports: []

shared_services:
  - name: postgres
    environments:
      prod: {}
      stage: {}
  - name: portainer
    environments:
      prod:
        domain: portainer.dimeapp.co.ke
  - name: grafana
    environments:
      prod:
        domain: grafana.dimeapp.co.ke


apps:
  - name: invoicing
    repo: dime-consultants/invoicing
    port_env: API_PORT
    postgres_database: invoicing
    environments:
      prod:
        domain: invoicing.dimeconsultants.africa
        port: 6000
      stage:
        domain: stage-invoicing.dimeconsultants.africa
        port: 6001

  - name: guardian
    repo: dime-consultants/guardian
    port_env: API_PORT
    environments:
      prod:
        domain: guardian.dimeconsultants.africa
        port: 3004
      stage:
        domain: stage-guardian.dimeconsultants.africa
        port: 3005

extra_domains: []
