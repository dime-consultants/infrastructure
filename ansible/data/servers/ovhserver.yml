server_name: ovhserver
ssh_user: ubuntu
ssh_secret_name: OVHSERVER_SSH_KEY
public_ip: 51.77.147.233

firewall_extra_ports: []

apps:
  - name: zanaka-backend
    repo: stevendegwa/zanaka
    environments:
      prod:
        domain: api.stmarysacademy.sc.ke
        port: 8000
      stage:
        domain: stage-api.stmarysacademy.sc.ke
        port: 8001

  - name: zanaka-ui
    repo: stevendegwa/zanaka-ui
    environments:
      prod:
        domain: app.stmarysacademy.sc.ke
        port: 3004
      stage:
        domain: stage-app.stmarysacademy.sc.ke
        port: 3005

  - name: rentwave-backend
