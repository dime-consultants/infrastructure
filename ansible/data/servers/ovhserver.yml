server_name: ovhserver
ssh_user: ubuntu
ssh_secret_name: OVHSERVER_SSH_KEY
public_ip: 51.77.147.233

firewall_extra_ports: []

apps:
  - name: zanaka
    repo: SteveNdegwa/zanaka
    environments:
      prod:
        domain: app.mchangohub.com
        port: 8000

  - name: rentwave-backend
    repo: rentwave/mvpm
    environments:
      prod:
        domain: app.rentwave.africa
        port: 8002
      stage:
        domain: stage-app.rentwave.africa
        port: 8001

  - name: rentwave-ui
    repo: rentwave/mvpm-ui
    environments:
      prod:
        domain: rentwave.africa
        port: 3000

extra_domains:
   - domain: flower.mchangohub.com
     proxy_port: 5555
   - domain: portainer.mchangohub.com
     proxy_port: 9000
   - domain: grafana.mchangohub.com
     proxy_port: 3000
   - domain: rabbit.mchangohub.com
     proxy_port: 15672
     basic_auth: true