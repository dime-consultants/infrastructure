server_name: ovhserver
ssh_secret_name: OVHSERVER_SSH_KEY
ssh_user_secret_name: OVHSERVER_SSH_USER
public_ip_secret_name: OVHSERVER_PUBLIC_IP

firewall_extra_ports: []

shared_services:
  - name: postgres
    environments:
      prod: {}
      stage: {}
  - name: rabbitmq
    environments:
      prod:
        domain: rabbitmq.stmarysacademy.sc.ke
        basic_auth: true
      stage: {}
  - name: portainer
    environments:
      prod:
        domain: portainer.rentwaveafrica.co.ke
      stage: {}
  - name: grafana
    environments:
      prod:
        domain: grafana.rentwaveafrica.co.ke
      stage: {}
  - name: flower
    environments:
      prod:
        domain: flower.stmarysacademy.sc.ke
        basic_auth: true
      stage: {}

apps:
  - name: zanaka-backend
    repo: stevendegwa/zanaka
    environments:
      prod:
        domain: api.stmarysacademy.sc.ke
        port: 8000
        postgres_database: zanaka
        rabbitmq_namespace: zanaka
      stage:
        domain: stage-api.stmarysacademy.sc.ke
        port: 8001
        postgres_database: zanaka
        rabbitmq_namespace: zanaka

  - name: zanaka-ui
    repo: stevendegwa/zanaka-ui
    environments:
      prod:
        domain: app.stmarysacademy.sc.ke
        port: 3004
      stage:
        domain: stage-app.stmarysacademy.sc.ke
        port: 3005

  - name: rentwave-backend
    repo: rentwave/mvpm
    environments:
      prod:
        domain: api.rentwaveafrica.co.ke
        port: 8002
        postgres_database: rentwave
        rabbitmq_namespace: rentwave
      stage:
        domain: stage-api.rentwaveafrica.co.ke
        port: 8003
        postgres_database: rentwave
        rabbitmq_namespace: rentwave

  - name: rentwave-ui
    repo: rentwave/mvpm-ui
    environments:
      prod:
        domain: rentwaveafrica.co.ke
        port: 3001
      stage:
        domain: stage.rentwaveafrica.co.ke
        port: 3002

  - name: rentwave-utilities-backend
    repo: stevendegwa/mvpm-utilities
    environments:
      prod:
        domain: utilities.rentwaveafrica.co.ke
        port: 8005
        postgres_database: rentwave-utilities
        rabbitmq_namespace: rentwave-utilities
      stage:
        domain: stage-utilities.rentwaveafrica.co.ke
        port: 8006
        postgres_database: rentwave-utilities
        rabbitmq_namespace: rentwave-utilities

  - name: st-marys-academy-website
    repo: stevendegwa/st-marys-academy-website
    environments:
      prod:
        domain: stmarysacademy.sc.ke
        port: 3003

  - name: lipasync-backend
    repo: jkmutua/lipasync
    environments:
      prod:
        domain: api.lipasync.com
        port: 8007
        postgres_database: lipasync
        rabbitmq_namespace: lipasync
      stage:
        domain: stage-api.lipasync.com
        port: 8008
        postgres_database: lipasync
        rabbitmq_namespace: lipasync

  - name: lipasync-ui
    repo: jkmutua/lipasync-ui
    environments:
      prod:
        domain: lipasync.com
        port: 3006
      stage:
        domain: stage.lipasync.com
        port: 3007

  - name: quidpath-backend
    repo: quidpath/quidpath
    environments:
      prod:
        domain: api.quidpath.com
        port: 8004
        postgres_database: quidpath
        rabbitmq_namespace: quidpath
