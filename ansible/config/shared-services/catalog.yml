---
# Shared services are deployed as standalone Docker Compose projects.
# Servers opt in with `shared_services` in ansible/config/environments/*.yml.
shared_service_base_dir: /opt/shared-services
shared_service_environments:
  - prod
  - stage

shared_service_networks:
  prod: shared-prod
  stage: shared-stage

shared_service_catalog:
  postgres:
    description: PostgreSQL database server
    compose_file: ../services/shared/postgres/docker-compose.yml
    environments:
      prod:
        bind_host: 10.42.0.1
        published_port: 5432
        network: shared-prod
        volume: shared_postgres_prod_data
        service_host: postgres
        secret_names:
          username: POSTGRES_PROD_USER
          password: POSTGRES_PROD_PASSWORD
      stage:
        bind_host: 10.42.0.1
        published_port: 5433
        network: shared-stage
        volume: shared_postgres_stage_data
        service_host: postgres
        secret_names:
          username: POSTGRES_STAGE_USER
          password: POSTGRES_STAGE_PASSWORD

  rabbitmq:
    description: RabbitMQ broker with management UI
    compose_file: ../services/shared/rabbitmq/docker-compose.yml
    environments:
      prod:
        bind_host: 10.42.0.1
        amqp_port: 5672
        management_port: 15672
        network: shared-prod
        volume: shared_rabbitmq_prod_data
        service_host: rabbitmq
        secret_names:
          username: RABBITMQ_PROD_USER
          password: RABBITMQ_PROD_PASSWORD
      stage:
        bind_host: 10.42.0.1
        amqp_port: 5673
        management_port: 15673
        network: shared-stage
        volume: shared_rabbitmq_stage_data
        service_host: rabbitmq
        secret_names:
          username: RABBITMQ_STAGE_USER
          password: RABBITMQ_STAGE_PASSWORD

  portainer:
    description: Docker management UI
    compose_file: ../services/shared/portainer/docker-compose.yml
    environments:
      prod:
        http_port: 9000
        https_port: 9443
        network: shared-prod
        volume: shared_portainer_prod_data
        service_host: portainer
      stage:
        http_port: 9001
        https_port: 9444
        network: shared-stage
        volume: shared_portainer_stage_data
        service_host: portainer

  grafana:
    description: Metrics and dashboard UI
    compose_file: ../services/shared/grafana/docker-compose.yml
    environments:
      prod:
        published_port: 3000
        network: shared-prod
        volume: shared_grafana_prod_data
        loki_volume: shared_loki_prod_data
        promtail_volume: shared_promtail_prod_data
        prometheus_port: 9090
        prometheus_volume: shared_prometheus_prod_data
        prometheus_retention: 15d
        service_host: grafana
        secret_names:
          username: GRAFANA_PROD_USER
          password: GRAFANA_PROD_PASSWORD
      stage:
        published_port: 3100
        network: shared-stage
        volume: shared_grafana_stage_data
        loki_volume: shared_loki_stage_data
        promtail_volume: shared_promtail_stage_data
        prometheus_port: 9091
        prometheus_volume: shared_prometheus_stage_data
        prometheus_retention: 7d
        service_host: grafana
        secret_names:
          username: GRAFANA_STAGE_USER
          password: GRAFANA_STAGE_PASSWORD

  flower:
    description: Celery task monitoring UI
    compose_file: ../services/shared/flower/docker-compose.yml
    environments:
      prod:
        published_port: 5555
        network: shared-prod
        service_host: flower
      stage:
        published_port: 5556
        network: shared-stage
        service_host: flower
