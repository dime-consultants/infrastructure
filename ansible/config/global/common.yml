common_packages:
  - ufw
  - python3-docker
  - fail2ban
  - unattended-upgrades

nginx_packages:
  - nginx
  - certbot
  - python3-certbot-nginx

certbot:
  enabled: true
  email: admin@mchangohub.com
  webroot: /var/www/letsencrypt
  retries: 3
  retry_delay: 20
  fail_on_error: false
  keep_until_expiring: true
  staging: false
  renewal_reload_service: nginx

security_baseline:
  unattended_upgrades: true
  fail2ban: true

docker_maintenance:
  log_max_size: 20m
  log_max_file: "5"
  journal_vacuum_time: 14d
  temp_file_min_age_days: 2
  max_disk_use_percent: 90

backup_defaults:
  enabled: false
  repository_secret_name: RESTIC_REPOSITORY
  password_secret_name: RESTIC_PASSWORD
  schedule: "*-*-* 02:30:00"
  randomized_delay_sec: "30m"
  retention:
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6
  paths:
    - /opt
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
    - /etc/letsencrypt
  postgres:
    enabled: true

load_balancing_defaults:
  method: round_robin
  max_fails: 3
  fail_timeout: 30s

k3s:
  enabled: false
  channel: stable
  install_script_url: https://get.k3s.io
  kubeconfig_path: /etc/rancher/k3s/k3s.yaml
  write_kubeconfig_mode: "0644"
  disable: []
  install_helm: true
  helm_install_script_url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
  space_guard:
    enabled: true
    max_disk_use_percent: 85
    journal_vacuum_size: 300M
    temp_file_min_age_days: 2
    on_boot_sec: 10m
    on_unit_active_sec: 1h
    randomized_delay_sec: 10m
    run_now: true
  firewall_ports:
    - 80
    - 443
    - 6443

migration_cleanup:
  purge_nginx_when_k3s: false
  stop_docker_when_k3s: false
  disable_docker_when_k3s: false
  uninstall_k3s_when_docker: false
  docker_prune_when_docker: false
  docker_prune_volumes_when_docker: false
  docker_prune_images_when_docker: false
