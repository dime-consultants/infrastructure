---
- name: Resolve Postgres database credentials
  set_fact:
    postgres_database_name: "{{ postgres_app_env.postgres_database }}"
    postgres_database_user: "{{ lookup('env', postgres_secret_names.username) }}"
    postgres_database_password: "{{ lookup('env', postgres_secret_names.password) }}"
    postgres_admin_database: "{{ shared_service_env_config.database | default('postgres') }}"
    postgres_shared_project_dir: "{{ shared_service_base_dir }}/{{ shared_service_name }}/{{ shared_service_env }}"
    postgres_shared_project_name: "shared_{{ shared_service_name }}_{{ shared_service_env }}"

- name: Validate Postgres database credentials
  assert:
    that:
      - postgres_database_name | length > 0
      - postgres_database_user | length > 0
      - postgres_database_password | length > 0
      - postgres_admin_database | length > 0
    fail_msg: "Missing Postgres config or GitHub Secrets for {{ postgres_app.name }}:{{ shared_service_env }}."

- name: Provision Postgres database
  ansible.builtin.shell: |
    set -eu

    POSTGRES_CONTAINER="$(
      docker compose \
        --project-directory "{{ postgres_shared_project_dir }}" \
        -p "{{ postgres_shared_project_name }}" \
        -f "{{ postgres_shared_project_dir }}/docker-compose.yml" \
        ps -q postgres
    )"

    if [ -z "$POSTGRES_CONTAINER" ]; then
      echo "Postgres shared service container not found for {{ postgres_shared_project_name }}" >&2
      exit 1
    fi

    docker exec \
      -e PGPASSWORD \
      -e POSTGRES_USER \
      -e POSTGRES_DB \
      -e APP_DB_NAME \
      "$POSTGRES_CONTAINER" \
      sh -s <<'SH'
    set -eu

    APP_DB_SQL=$(printf "%s" "$APP_DB_NAME" | sed "s/'/''/g")
    DB_EXISTS="$(
      psql -v ON_ERROR_STOP=1 \
        -U "$POSTGRES_USER" \
        -d "$POSTGRES_DB" \
        -tAc "SELECT 1 FROM pg_database WHERE datname = '$APP_DB_SQL'"
    )"

    if [ "$DB_EXISTS" != "1" ]; then
      createdb \
        -U "$POSTGRES_USER" \
        -O "$POSTGRES_USER" \
        "$APP_DB_NAME"
      echo "created database $APP_DB_NAME"
    else
      echo "database $APP_DB_NAME already exists"
    fi

    psql -v ON_ERROR_STOP=1 \
      -U "$POSTGRES_USER" \
      -d "$APP_DB_NAME" \
      -c "GRANT ALL ON SCHEMA public TO \"$POSTGRES_USER\";"
    SH
  environment:
    PGPASSWORD: "{{ postgres_database_password }}"
    POSTGRES_USER: "{{ postgres_database_user }}"
    POSTGRES_DB: "{{ postgres_admin_database }}"
    APP_DB_NAME: "{{ postgres_database_name }}"
  register: postgres_database_provision
  changed_when: true

- name: Verify Postgres database exists
  ansible.builtin.shell: |
    set -eu

    POSTGRES_CONTAINER="$(
      docker compose \
        --project-directory "{{ postgres_shared_project_dir }}" \
        -p "{{ postgres_shared_project_name }}" \
        -f "{{ postgres_shared_project_dir }}/docker-compose.yml" \
        ps -q postgres
    )"

    docker exec \
      -e PGPASSWORD \
      -e POSTGRES_USER \
      -e POSTGRES_DB \
      -e APP_DB_NAME \
      "$POSTGRES_CONTAINER" \
      sh -s <<'SH'
    set -eu
    APP_DB_SQL=$(printf "%s" "$APP_DB_NAME" | sed "s/'/''/g")
    psql -v ON_ERROR_STOP=1 \
      -U "$POSTGRES_USER" \
      -d "$POSTGRES_DB" \
      -tAc "SELECT 1 FROM pg_database WHERE datname = '$APP_DB_SQL'"
    SH
  environment:
    PGPASSWORD: "{{ postgres_database_password }}"
    POSTGRES_USER: "{{ postgres_database_user }}"
    POSTGRES_DB: "{{ postgres_admin_database }}"
    APP_DB_NAME: "{{ postgres_database_name }}"
  register: postgres_database_verify
  changed_when: false
  failed_when: postgres_database_verify.stdout | trim != "1"
