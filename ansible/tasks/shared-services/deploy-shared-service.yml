---
- name: Validate shared service subscription
  assert:
    that:
      - shared_service_name in shared_service_catalog
      - shared_service_env in shared_service_catalog[shared_service_name].environments
    fail_msg: >-
      Unknown shared service subscription {{ shared_service_name }}:{{ shared_service_env }}.
      Check ansible/config/shared-services/catalog.yml.

- name: Resolve shared service config
  set_fact:
    shared_service_config: "{{ shared_service_catalog[shared_service_name] }}"
    shared_service_env_config: >-
      {{
        shared_service_catalog[shared_service_name].environments[shared_service_env]
        | combine(
            (
              shared_service_subscription.environments[shared_service_env]
              | default({}, true)
              if shared_service_subscription.environments is mapping
              else {}
            ),
            recursive=True
          )
      }}
    shared_service_project_dir: "{{ shared_service_base_dir }}/{{ shared_service_name }}/{{ shared_service_env }}"

- name: Ensure shared service project directory exists
  file:
    path: "{{ shared_service_project_dir }}"
    state: directory
    mode: "0755"

- name: Ensure shared service Docker network exists
  community.docker.docker_network:
    name: "{{ shared_service_env_config.network }}"
    state: present

- name: Copy shared service compose file
  copy:
    src: "{{ shared_service_config.compose_file }}"
    dest: "{{ shared_service_project_dir }}/docker-compose.yml"
    mode: "0644"

- name: Copy Grafana Promtail config
  copy:
    src: ../services/shared/grafana/promtail-config.yml
    dest: "{{ shared_service_project_dir }}/promtail-config.yml"
    mode: "0644"
  when: shared_service_name == 'grafana'

- name: Copy Grafana Loki config
  copy:
    src: ../services/shared/grafana/loki-config.yml
    dest: "{{ shared_service_project_dir }}/loki-config.yml"
    mode: "0644"
  when: shared_service_name == 'grafana'

- name: Copy Grafana Prometheus config
  copy:
    src: ../services/shared/grafana/prometheus.yml
    dest: "{{ shared_service_project_dir }}/prometheus.yml"
    mode: "0644"
  when: shared_service_name == 'grafana'

- name: Copy Grafana provisioning files
  copy:
    src: ../services/shared/grafana/provisioning/
    dest: "{{ shared_service_project_dir }}/provisioning/"
    mode: "0644"
    directory_mode: "0755"
  when: shared_service_name == 'grafana'

- name: Render shared service environment file
  template:
    src: ../templates/shared-service.env.j2
    dest: "{{ shared_service_project_dir }}/.env"
    mode: "0600"
    owner: root
    group: root

- name: Deploy shared service
  block:
    - name: Start shared service compose project
      community.docker.docker_compose_v2:
        project_src: "{{ shared_service_project_dir }}"
        project_name: "shared_{{ shared_service_name }}_{{ shared_service_env }}"
        files:
          - docker-compose.yml
        env_files:
          - .env
        state: present
        pull: "{{ shared_service_compose_pull | default('always') }}"
        recreate: "{{ shared_service_compose_recreate | default('auto') }}"
        remove_orphans: true
  rescue:
    - name: Show shared service container status
      command: >
        docker compose
        --project-directory {{ shared_service_project_dir }}
        -p shared_{{ shared_service_name }}_{{ shared_service_env }}
        -f {{ shared_service_project_dir }}/docker-compose.yml
        ps
      register: shared_service_ps
      changed_when: false
      failed_when: false

    - name: Show shared service logs
      command: >
        docker compose
        --project-directory {{ shared_service_project_dir }}
        -p shared_{{ shared_service_name }}_{{ shared_service_env }}
        -f {{ shared_service_project_dir }}/docker-compose.yml
        logs --tail=100 --no-color
      register: shared_service_logs
      changed_when: false
      failed_when: false

    - name: Print shared service diagnostics
      debug:
        msg:
          - "docker compose ps:"
          - "{{ shared_service_ps.stdout_lines | default([]) }}"
          - "docker compose logs --tail=100:"
          - "{{ shared_service_logs.stdout_lines | default([]) }}"

    - name: Fail shared service deployment
      fail:
        msg: "Shared service {{ shared_service_name }}:{{ shared_service_env }} failed to become healthy."
