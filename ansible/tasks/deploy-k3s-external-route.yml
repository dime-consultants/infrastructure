---
- name: Resolve external route facts
  set_fact:
    external_route_release: "{{ ('external-' ~ route.domain) | regex_replace('[^A-Za-z0-9-]', '-') | lower | truncate(53, true, '') }}"
    external_route_namespace: "{{ route.namespace | default('external-routes') }}"
    external_route_values_file: "/tmp/external-route-{{ route.domain | regex_replace('[^A-Za-z0-9-]', '-') }}.yml"
    external_route_chart_remote_path: "/tmp/external-route-chart"
    external_route_backend_host_raw: "{{ route.backend_host }}"

- name: Resolve external route chart resource names
  set_fact:
    external_route_chart_fullname: "{{ (external_route_release ~ '-external-route') | truncate(63, true, '') | regex_replace('-$', '') }}"

- name: Resolve external route backend hostname to IPv4
  shell: |
    set -eu
    getent ahostsv4 {{ external_route_backend_host_raw | quote }} | awk 'NR == 1 { print $1 }'
  register: external_route_backend_lookup
  changed_when: false
  when: not (external_route_backend_host_raw is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$'))

- name: Set external route backend IP
  set_fact:
    external_route_backend_host: >-
      {{
        external_route_backend_host_raw
        if (external_route_backend_host_raw is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$'))
        else (external_route_backend_lookup.stdout_lines | default([]) | first | default(''))
      }}

- name: Validate external route backend IP
  assert:
    that:
      - external_route_backend_host is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: "External route {{ route.domain }} backend {{ external_route_backend_host_raw }} did not resolve to an IPv4 address."

- name: Create external route namespace
  shell: |
    set -eu
    cat <<'EOF' | /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }} apply -f -
    apiVersion: v1
    kind: Namespace
    metadata:
      name: {{ external_route_namespace }}
    EOF
  register: external_route_namespace_apply
  changed_when: "'created' in external_route_namespace_apply.stdout or 'configured' in external_route_namespace_apply.stdout"

- name: Render external route values
  template:
    src: ../templates/external-route-values.yml.j2
    dest: "{{ external_route_values_file }}"
    mode: "0600"

- name: Copy external route Helm chart to target host
  copy:
    src: "{{ playbook_dir }}/../helm/external-route/"
    dest: "{{ external_route_chart_remote_path }}/"
    mode: preserve

- name: Deploy external route
  command: >
    /usr/local/bin/helm upgrade --install {{ external_route_release }} {{ external_route_chart_remote_path }}
    --namespace {{ external_route_namespace }}
    --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    --values {{ external_route_values_file }}
    --wait
    --timeout 3m
  register: external_route_deploy
  changed_when: "'Release' in external_route_deploy.stdout or 'deployed' in external_route_deploy.stdout or 'upgraded' in external_route_deploy.stdout"

- name: Wait for external route TLS certificate
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    -n {{ external_route_namespace }}
    wait certificate {{ external_route_chart_fullname }}-tls
    --for=condition=Ready
    --timeout={{ route.certificate_ready_timeout | default('180s') }}
  register: external_route_certificate_wait
  changed_when: false
  failed_when: false
  when:
    - k3s.cert_manager.enabled | default(false) | bool
    - k3s.cert_manager.cluster_issuer.enabled | default(true) | bool

- name: Show external route certificate status when not ready
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    -n {{ external_route_namespace }}
    describe certificate {{ external_route_chart_fullname }}-tls
  register: external_route_certificate_status
  changed_when: false
  failed_when: false
  when:
    - external_route_certificate_wait is defined
    - external_route_certificate_wait.rc | default(0) != 0

- name: Fail when external route TLS certificate is not ready
  fail:
    msg: |
      TLS certificate for {{ route.domain }} did not become Ready.

      kubectl wait:
      {{ external_route_certificate_wait.stderr | default(external_route_certificate_wait.stdout | default('unavailable')) }}

      Certificate status:
      {{ external_route_certificate_status.stdout | default(external_route_certificate_status.stderr | default('unavailable')) }}
  when:
    - external_route_certificate_wait is defined
    - external_route_certificate_wait.rc | default(0) != 0
