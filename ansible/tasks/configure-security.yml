---
- name: Configure unattended security updates
  template:
    src: ../templates/20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: security_baseline.unattended_upgrades | default(true) | bool

- name: Configure Fail2Ban jails
  template:
    src: ../templates/fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  when: security_baseline.fail2ban | default(true) | bool
  notify: Restart Fail2Ban

- name: Configure sshd startup connection limits
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxStartups\s+'
    line: "MaxStartups {{ security_baseline.sshd_max_startups | default('20:30:100') }}"
    validate: sshd -t -f %s
  notify: Restart SSH

- name: Ensure Fail2Ban is enabled
  service:
    name: fail2ban
    state: started
    enabled: yes
  when: security_baseline.fail2ban | default(true) | bool
