---
- name: Check whether K3s is installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Refresh apt cache before K3s bootstrap
  command: apt-get update
  register: k3s_apt_update_result
  changed_when: false
  retries: 5
  delay: 10
  until: k3s_apt_update_result.rc == 0

- name: Install K3s installer dependencies
  apt:
    name:
      - ca-certificates
      - curl
    state: present
  register: k3s_dependency_install
  retries: 5
  delay: 10
  until: k3s_dependency_install is succeeded

- name: Build K3s install arguments
  set_fact:
    k3s_install_exec: >-
      server
      --write-kubeconfig-mode {{ k3s.write_kubeconfig_mode | default('0644') }}
      {%- for component in k3s.disable | default([]) %}
      --disable {{ component }}
      {%- endfor %}

- name: Install K3s
  shell: "curl -sfL {{ k3s.install_script_url | default('https://get.k3s.io') }} | INSTALL_K3S_CHANNEL={{ k3s.channel | default('stable') }} INSTALL_K3S_EXEC='{{ k3s_install_exec }}' sh -"
  args:
    creates: /usr/local/bin/k3s
  register: k3s_install_result
  retries: 3
  delay: 20
  until: k3s_install_result.rc == 0
  when: not k3s_binary.stat.exists

- name: Read existing K3s systemd unit
  slurp:
    src: /etc/systemd/system/k3s.service
  register: k3s_service_unit
  when: k3s_binary.stat.exists

- name: Reconfigure existing K3s service when Traefik should be enabled
  shell: "curl -sfL {{ k3s.install_script_url | default('https://get.k3s.io') }} | INSTALL_K3S_CHANNEL={{ k3s.channel | default('stable') }} INSTALL_K3S_EXEC='{{ k3s_install_exec }}' sh -"
  when:
    - k3s_binary.stat.exists
    - "'traefik' not in (k3s.disable | default([]))"
    - "'--disable' in (k3s_service_unit.content | b64decode)"
    - "'traefik' in (k3s_service_unit.content | b64decode)"
  register: k3s_reconfigured
  retries: 3
  delay: 20
  until: k3s_reconfigured.rc == 0

- name: Ensure K3s service is started and enabled
  service:
    name: k3s
    state: started
    enabled: yes

- name: Restart K3s after service reconfiguration
  service:
    name: k3s
    state: restarted
  when: k3s_reconfigured is defined and k3s_reconfigured.changed

- name: Wait for K3s API
  command: /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }} get nodes
  register: k3s_nodes
  changed_when: false
  retries: 20
  delay: 6
  until: k3s_nodes.rc == 0

- name: Configure Traefik ACME certificates
  template:
    src: ../templates/traefik-config.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    owner: root
    group: root
    mode: "0600"
  when:
    - "'traefik' not in (k3s.disable | default([]))"
    - (k3s.traefik_acme | default({})).enabled | default(false) | bool

- name: Wait for Traefik deployment when K3s owns ingress
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    -n kube-system rollout status deployment/traefik --timeout=180s
  changed_when: false
  when: "'traefik' not in (k3s.disable | default([]))"

- name: Check Traefik service when K3s owns ingress
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    -n kube-system get service traefik
  changed_when: false
  when: "'traefik' not in (k3s.disable | default([]))"

- name: Configure cert-manager
  include_tasks: "{{ playbook_dir }}/../tasks/configure-cert-manager.yml"
  when: k3s.cert_manager.enabled | default(false) | bool

- name: Check whether Helm is installed
  stat:
    path: /usr/local/bin/helm
  register: helm_binary
  when: k3s.install_helm | default(true) | bool

- name: Install Helm
  shell: "curl -fsSL {{ k3s.helm_install_script_url | default('https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3') }} | bash"
  args:
    creates: /usr/local/bin/helm
  register: helm_install_result
  retries: 3
  delay: 20
  until: helm_install_result.rc == 0
  when:
    - k3s.install_helm | default(true) | bool
    - not helm_binary.stat.exists

- name: Allow Kubernetes API through UFW
  ufw:
    rule: allow
    port: "{{ item }}"
  loop: "{{ k3s.firewall_ports | default([]) }}"
  when: k3s.firewall_ports | default([]) | length > 0
