---
# =========================
# CLEAN DEFAULT NGINX
# =========================

- name: Remove default Nginx site symlink
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Remove default Nginx config file
  file:
    path: /etc/nginx/sites-available/default
    state: absent

# =========================
# DOMAIN COLLECTION
# =========================

- name: Gather all app domains
  set_fact:
    app_domains: >-
      {{
        apps
        | map(attribute='environments')
        | map('dict2items')
        | flatten
        | map(attribute='value.domain')
        | select('defined')
        | select('truthy')
        | list
      }}

- name: Gather extra-only domains
  set_fact:
    extra_only_domains: >-
      {{
        extra_domains
        | map(attribute='domain')
        | difference(app_domains)
        | list
      }}

- name: Combine all domains
  set_fact:
    all_domains: "{{ (app_domains + extra_only_domains) | unique }}"

# =========================
# ACME WEBROOT (CRITICAL)
# =========================

- name: Ensure ACME challenge directories exist
  file:
    path: /var/www/letsencrypt/.well-known/acme-challenge
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
    recurse: yes

# =========================
# HTTP CONFIGS
# =========================

- name: Generate HTTP configs for apps
  include_tasks: generate-nginx-app.yml
  loop: "{{ apps }}"
  loop_control:
    loop_var: app
  vars:
    ssl_enabled: false

- name: Generate HTTP configs for extra tools
  template:
    src: ../templates/nginx-extra-http.j2
    dest: "/etc/nginx/sites-available/extra-{{ item.domain | replace('.', '-') }}.conf"
    mode: "0644"
  loop: "{{ extra_domains }}"
  when: item.domain in extra_only_domains

- name: Enable all HTTP sites
  file:
    src: "/etc/nginx/sites-available/{{ item }}"
    dest: "/etc/nginx/sites-enabled/{{ item }}"
    state: link
  loop: >-
    {{
      lookup('ansible.builtin.fileglob',
             '/etc/nginx/sites-available/*.conf',
             wantlist=True)
      | map('basename')
      | list
    }}

- name: Test nginx HTTP config
  command: nginx -t
  changed_when: false

- name: Reload nginx (HTTP)
  service:
    name: nginx
    state: reloaded

# =========================
# CERTBOT (STRICT)
# =========================

- name: Obtain certificates via webroot
  command: >
    certbot certonly
    --webroot
    -w /var/www/letsencrypt
    {% for d in all_domains %}-d {{ d }} {% endfor %}
    --non-interactive
    --agree-tos
    --email admin@mchangohub.com
  register: certbot
  failed_when:
    - certbot.rc != 0
    - "'Congratulations' not in certbot.stdout"

# =========================
# SSL SAFETY CHECKS
# =========================

- name: Check which domains have certificates
  stat:
    path: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
  loop: "{{ all_domains }}"
  register: cert_stats

- name: Build list of SSL-ready domains
  set_fact:
    ssl_ready_domains: >-
      {{
        cert_stats.results
        | selectattr('stat.exists', 'equalto', true)
        | map(attribute='item')
        | list
      }}

# =========================
# HTTPS CONFIGS
# =========================

- name: Regenerate HTTPS configs for apps
  include_tasks: generate-nginx-app.yml
  loop: "{{ apps }}"
  loop_control:
    loop_var: app
  vars:
    ssl_enabled: true
  when: app.environments.prod.domain in ssl_ready_domains

- name: Generate HTTPS configs for extra tools
  template:
    src: ../templates/nginx-extra-https.j2
    dest: "/etc/nginx/sites-available/extra-{{ item.domain | replace('.', '-') }}.conf"
    mode: "0644"
  loop: "{{ extra_domains }}"
  when:
    - item.domain in extra_only_domains
    - item.domain in ssl_ready_domains

# =========================
# CLEAN INVALID HTTPS CONFIGS
# =========================

- name: Remove HTTPS configs without certificates (sites-available)
  file:
    path: "/etc/nginx/sites-available/extra-{{ item | replace('.', '-') }}.conf"
    state: absent
  loop: "{{ all_domains | difference(ssl_ready_domains) }}"

- name: Remove dangling HTTPS symlinks (sites-enabled)
  file:
    path: "/etc/nginx/sites-enabled/extra-{{ item | replace('.', '-') }}.conf"
    state: absent
  loop: "{{ all_domains | difference(ssl_ready_domains) }}"

# =========================
# FINAL VALIDATION
# =========================

- name: Test nginx HTTPS config
  command: nginx -t
  changed_when: false

- name: Reload nginx (HTTPS)
  service:
    name: nginx
    state: reloaded
