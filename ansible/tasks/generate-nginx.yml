---
- name: Remove default Nginx site symlink
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Remove default Nginx config file
  file:
    path: /etc/nginx/sites-available/default
    state: absent

- name: Remove previously generated Nginx site symlinks
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ lookup('ansible.builtin.fileglob', '/etc/nginx/sites-enabled/*.conf', wantlist=True) }}"

- name: Remove previously generated Nginx site configs
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ lookup('ansible.builtin.fileglob', '/etc/nginx/sites-available/*.conf', wantlist=True) }}"

- name: Gather all app domains
  set_fact:
    app_domains_json: >-
      {%- set domains = [] -%}
      {%- for app in apps | default([]) -%}
      {%- if app.environments is mapping -%}
      {%- for env_name, env_options in app.environments.items() -%}
      {%- set merged_env = app | combine(env_options | default({}), recursive=True) -%}
      {%- if env_options.domain is defined and merged_env.nginx_managed | default(true) and (merged_env.port is defined or merged_env.backends is defined or (merged_env.load_balancing is defined and merged_env.load_balancing.backends is defined)) -%}
      {%- set _ = domains.append(env_options.domain) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {{ domains | to_json }}

- name: Parse app domains
  set_fact:
    app_domains: "{{ app_domains_json | from_json }}"

- name: Gather shared service domains
  set_fact:
    shared_service_domains_json: >-
      {%- set domains = [] -%}
      {%- for service in shared_services | default([]) -%}
      {%- if service.name in shared_service_catalog and service.environments is mapping -%}
      {%- for env_name, env_options in service.environments.items() -%}
      {%- if env_options.domain is defined and env_name in shared_service_catalog[service.name].environments -%}
      {%- set catalog_env = shared_service_catalog[service.name].environments[env_name] -%}
      {%- set proxy_port = env_options.proxy_port
          | default(env_options.management_port
          | default(env_options.http_port
          | default(env_options.published_port
          | default(env_options.amqp_port
          | default(catalog_env.management_port
          | default(catalog_env.http_port
          | default(catalog_env.published_port
          | default(catalog_env.amqp_port | default(omit))))))))) -%}
      {%- set _ = domains.append({
        'domain': env_options.domain,
        'proxy_port': proxy_port,
        'basic_auth': (env_options.basic_auth | default(false)) and service.name != 'rabbitmq',
        'preserve_authorization': env_options.preserve_authorization | default(service.name in ['rabbitmq', 'portainer', 'grafana'])
      }) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {{ domains | to_json }}

- name: Parse shared service domains
  set_fact:
    shared_service_domains: "{{ shared_service_domains_json | from_json }}"

- name: Combine manually configured and shared service proxy domains
  set_fact:
    proxy_domains: "{{ (extra_domains | default([])) + (shared_service_domains | default([])) }}"

- name: Gather extra-only domains
  set_fact:
    extra_only_domains: >-
      {{
        proxy_domains
        | map(attribute='domain')
        | difference(app_domains)
        | list
      }}

- name: Combine all domains
  set_fact:
    all_domains: "{{ (app_domains + extra_only_domains) | unique }}"

- name: Ensure ACME challenge directories exist
  file:
    path: /var/www/letsencrypt/.well-known/acme-challenge
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
    recurse: yes

- name: Generate HTTP configs for apps
  include_tasks: generate-nginx-app.yml
  loop: "{{ apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  vars:
    ssl_enabled: false
    environments_to_use: >-
      {%- set envs = [] -%}
      {%- for env_item in app.environments | dict2items -%}
      {%- set merged_env = app | combine(env_item.value | default({}), recursive=True) -%}
      {%- if merged_env.nginx_managed | default(true) and (merged_env.port is defined or merged_env.backends is defined or (merged_env.load_balancing is defined and merged_env.load_balancing.backends is defined)) -%}
      {%- set _ = envs.append(env_item) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ envs }}

- name: Generate HTTP configs for extra tools
  template:
    src: ../templates/nginx-extra-http.j2
    dest: "/etc/nginx/sites-available/extra-{{ item.domain | replace('.', '-') }}.conf"
    mode: "0644"
  loop: "{{ proxy_domains }}"

- name: Enable all HTTP sites
  file:
    src: "/etc/nginx/sites-available/{{ item }}"
    dest: "/etc/nginx/sites-enabled/{{ item }}"
    state: link
  loop: >-
    {{
      lookup('ansible.builtin.fileglob',
             '/etc/nginx/sites-available/*.conf',
             wantlist=True)
      | map('basename')
      | list
    }}

- name: Test nginx HTTP config
  command: nginx -t
  changed_when: false

- name: Reload nginx (HTTP)
  service:
    name: nginx
    state: reloaded

- name: Obtain certificates via webroot
  command: >
    certbot certonly
    --webroot -w /var/www/letsencrypt
    -d {{ item }}
    --non-interactive --agree-tos --email admin@mchangohub.com
  loop: "{{ all_domains }}"
  register: certbot
  ignore_errors: yes

- name: Check which domains have certificates
  stat:
    path: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
  loop: "{{ all_domains }}"
  register: cert_stats

- name: Build list of SSL-ready domains
  set_fact:
    ssl_ready_domains: >-
      {{
        cert_stats.results
        | selectattr('stat.exists', 'equalto', true)
        | map(attribute='item')
        | list
      }}

- name: Regenerate HTTPS configs for apps (only environments with certificates)
  include_tasks: generate-nginx-app.yml
  loop: "{{ apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  vars:
    ssl_enabled: true
    environments_to_use: >-
      {%- set envs = [] -%}
      {%- for env_item in app.environments | dict2items -%}
      {%- set merged_env = app | combine(env_item.value | default({}), recursive=True) -%}
      {%- if env_item.value.domain is defined and env_item.value.domain in ssl_ready_domains and merged_env.nginx_managed | default(true) and (merged_env.port is defined or merged_env.backends is defined or (merged_env.load_balancing is defined and merged_env.load_balancing.backends is defined)) -%}
      {%- set _ = envs.append(env_item) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ envs }}
  when: environments_to_use | length > 0

- name: Debug – no HTTPS-ready environments
  debug:
    msg: "No valid certificates found for any environment of {{ app.name }}"
  loop: "{{ apps }}"
  loop_control:
    loop_var: app
  when:
    - app.environments is defined
    - (app.environments | dict2items | selectattr('value.domain', 'in', ssl_ready_domains) | list) | length == 0

- name: Generate HTTPS configs for extra tools
  template:
    src: ../templates/nginx-extra-https.j2
    dest: "/etc/nginx/sites-available/extra-{{ item.domain | replace('.', '-') }}.conf"
    mode: "0644"
  loop: "{{ proxy_domains }}"
  when: item.domain in ssl_ready_domains

- name: Enable HTTPS sites for extra tools
  file:
    src: "/etc/nginx/sites-available/extra-{{ item.domain | replace('.', '-') }}.conf"
    dest: "/etc/nginx/sites-enabled/extra-{{ item.domain | replace('.', '-') }}.conf"
    state: link
  loop: "{{ proxy_domains | selectattr('domain', 'in', ssl_ready_domains) | list }}"

- name: Enable HTTPS sites for apps
  file:
    src: "/etc/nginx/sites-available/{{ app.name }}-{{ env.key }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ app.name }}-{{ env.key }}.conf"
    state: link
  loop: >-
    {{
      apps
      | map('extract', 'environments')
      | map('dict2items')
      | flatten(levels=1)
    }}
  loop_control:
    loop_var: env
  vars:
    app: "{{ apps | selectattr('environments.' + env.key + '.domain', 'in', ssl_ready_domains) | first }}"
  when: app is defined

- name: Test nginx HTTPS config
  command: nginx -t
  changed_when: false

- name: Reload nginx (HTTPS)
  service:
    name: nginx
    state: reloaded
