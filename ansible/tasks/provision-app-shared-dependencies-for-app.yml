---
- name: Validate Postgres subscription for app environment
  assert:
    that:
      - app_postgres_subscription.environments is defined
      - app_postgres_subscription.environments is mapping
      - shared_dependency_app_env_item.key in app_postgres_subscription.environments
      - shared_dependency_app_env_item.key in shared_service_catalog.postgres.environments
    fail_msg: >-
      {{ inventory_hostname }} must subscribe to postgres:{{ shared_dependency_app_env_item.key }}
      because {{ shared_dependency_app.name }} declares postgres_database.
  loop: "{{ shared_dependency_app.environments | default({}) | dict2items }}"
  loop_control:
    loop_var: shared_dependency_app_env_item
    label: "{{ shared_dependency_app.name }}:{{ shared_dependency_app_env_item.key }}"
  when: shared_dependency_app_env_item.value.postgres_database is defined

- name: Provision Postgres database for app environment
  include_tasks: provision-postgres-database.yml
  loop: "{{ shared_dependency_app.environments | default({}) | dict2items }}"
  loop_control:
    loop_var: shared_dependency_app_env_item
    label: "{{ shared_dependency_app.name }}:{{ shared_dependency_app_env_item.key }}"
  vars:
    shared_service_name: postgres
    shared_service_env: "{{ shared_dependency_app_env_item.key }}"
    shared_service_env_config: "{{ shared_service_catalog.postgres.environments[shared_dependency_app_env_item.key] }}"
    postgres_app: "{{ shared_dependency_app }}"
    postgres_app_env: "{{ shared_dependency_app_env_item.value }}"
    postgres_secret_names: "{{ app_postgres_subscription.environments[shared_dependency_app_env_item.key].secret_names | default(shared_service_catalog.postgres.environments[shared_dependency_app_env_item.key].secret_names | default({})) }}"
  when: shared_dependency_app_env_item.value.postgres_database is defined

- name: Validate RabbitMQ subscription for app environment
  assert:
    that:
      - app_rabbitmq_subscription.environments is defined
      - app_rabbitmq_subscription.environments is mapping
      - shared_dependency_app_env_item.key in app_rabbitmq_subscription.environments
      - shared_dependency_app_env_item.key in shared_service_catalog.rabbitmq.environments
    fail_msg: >-
      {{ inventory_hostname }} must subscribe to rabbitmq:{{ shared_dependency_app_env_item.key }}
      because {{ shared_dependency_app.name }} declares rabbitmq_namespace.
  loop: "{{ shared_dependency_app.environments | default({}) | dict2items }}"
  loop_control:
    loop_var: shared_dependency_app_env_item
    label: "{{ shared_dependency_app.name }}:{{ shared_dependency_app_env_item.key }}"
  when: shared_dependency_app_env_item.value.rabbitmq_namespace is defined

- name: Provision RabbitMQ namespace for app environment
  include_tasks: provision-rabbitmq-namespace.yml
  loop: "{{ shared_dependency_app.environments | default({}) | dict2items }}"
  loop_control:
    loop_var: shared_dependency_app_env_item
    label: "{{ shared_dependency_app.name }}:{{ shared_dependency_app_env_item.key }}"
  vars:
    shared_service_name: rabbitmq
    shared_service_env: "{{ shared_dependency_app_env_item.key }}"
    rabbitmq_app: "{{ shared_dependency_app }}"
    rabbitmq_app_env: "{{ shared_dependency_app_env_item.value }}"
    rabbitmq_secret_names: "{{ app_rabbitmq_subscription.environments[shared_dependency_app_env_item.key].secret_names | default(shared_service_catalog.rabbitmq.environments[shared_dependency_app_env_item.key].secret_names | default({})) }}"
  when: shared_dependency_app_env_item.value.rabbitmq_namespace is defined

