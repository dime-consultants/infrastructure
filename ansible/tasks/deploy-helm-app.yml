---
- name: Validate Helm deployment settings
  assert:
    that:
      - (deployment_app_env.image is defined and deployment_app_env.image.repository is defined) or image_tag is defined or force_image_tag is defined
    fail_msg: "Helm deployments require deployment_app_env.image.repository or an image_tag/force_image_tag."

- name: Resolve Helm option maps
  set_fact:
    helm_options: "{{ deployment_app_env.helm | default({}) }}"
    image_options: "{{ deployment_app_env.image | default({}) }}"
    helm_dynamic_secret_env: {}

- name: Load generated environment file for Helm
  set_fact:
    helm_dynamic_secret_env: >-
      {{
        lookup(
          'pipe',
          'python3 ' ~ ((playbook_dir ~ '/../scripts/deployment_resolver.py') | quote) ~
          ' dotenv-json --input ' ~ (env_file | quote)
        ) | from_json
      }}
  when: env_file is defined

- name: Resolve Helm deployment facts
  set_fact:
    helm_release_name: "{{ helm_options.release_name | default((deployment_app.name ~ '-' ~ env) | regex_replace('[^A-Za-z0-9-]', '-')) }}"
    helm_namespace: "{{ helm_options.namespace | default(env) }}"
    helm_chart_src: "{{ helm_options.chart | default((playbook_dir | dirname) ~ '/helm/dime-app') }}"
    helm_chart_deploy_path: "{{ app_dir }}/chart"
    helm_values_file: "{{ app_dir }}/helm-values.yml"
    helm_image_tag: "{{ force_image_tag | default(image_tag | default(image_options.tag | default('latest'))) }}"

- name: Check K3s binary before Helm deploy
  stat:
    path: /usr/local/bin/k3s
  register: helm_k3s_binary

- name: Check K3s kubeconfig before Helm deploy
  stat:
    path: "{{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}"
  register: helm_k3s_kubeconfig

- name: Check Helm binary before Helm deploy
  stat:
    path: /usr/local/bin/helm
  register: helm_binary_for_deploy

- name: Validate K3s and Helm are ready for app deployment
  assert:
    that:
      - helm_k3s_binary.stat.exists
      - helm_k3s_kubeconfig.stat.exists
      - helm_binary_for_deploy.stat.exists
    fail_msg: >-
      This app is configured for deployment_type={{ deployment_runtime }}, but K3s/Helm is not ready on the target host.
      Run the base configure workflow for {{ inventory_hostname }} first, then rerun this app deployment.

- name: Verify Kubernetes API before Helm deploy
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    get nodes
  register: helm_k3s_nodes
  changed_when: false

- name: Create or update Kubernetes namespace
  shell: |
    set -eu
    cat <<'EOF' | /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }} apply -f -
    apiVersion: v1
    kind: Namespace
    metadata:
      name: {{ helm_namespace }}
    EOF
  register: namespace_apply
  changed_when: "'created' in namespace_apply.stdout or 'configured' in namespace_apply.stdout"

- name: Render Helm values
  template:
    src: ../templates/helm-values.yml.j2
    dest: "{{ helm_values_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Copy Helm chart to target host
  copy:
    src: "{{ helm_chart_src }}/"
    dest: "{{ helm_chart_deploy_path }}/"
    mode: preserve

- name: Check copied Helm chart on target host
  stat:
    path: "{{ helm_chart_deploy_path }}/Chart.yaml"
  register: helm_chart_deploy_chart

- name: Validate copied Helm chart on target host
  assert:
    that:
      - helm_chart_deploy_chart.stat.exists
    fail_msg: "Helm chart was not copied to {{ helm_chart_deploy_path }} on {{ inventory_hostname }}."

- name: Deploy Helm release
  command: >
    /usr/local/bin/helm upgrade --install {{ helm_release_name }} {{ helm_chart_deploy_path }}
    --namespace {{ helm_namespace }}
    --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    --values {{ helm_values_file }}
    --wait
    --timeout {{ helm_options.timeout | default('5m') }}
  register: helm_deploy
  changed_when: "'Release' in helm_deploy.stdout or 'deployed' in helm_deploy.stdout or 'upgraded' in helm_deploy.stdout"
