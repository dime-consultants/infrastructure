---
- name: Resolve RabbitMQ namespace credentials
  set_fact:
    rabbitmq_namespace: "{{ rabbitmq_app_env.rabbitmq_namespace }}"
    rabbitmq_username: "{{ lookup('env', rabbitmq_secret_names.username) }}"
    rabbitmq_password: "{{ lookup('env', rabbitmq_secret_names.password) }}"
    rabbitmq_shared_project_dir: "{{ shared_service_base_dir }}/{{ shared_service_name }}/{{ shared_service_env }}"
    rabbitmq_shared_project_name: "shared_{{ shared_service_name }}_{{ shared_service_env }}"

- name: Validate RabbitMQ namespace credentials
  assert:
    that:
      - rabbitmq_namespace | length > 0
      - rabbitmq_username | length > 0
      - rabbitmq_password | length > 0
    fail_msg: "Missing RabbitMQ config or GitHub Secrets for {{ rabbitmq_app.name }}:{{ shared_service_env }}."

- name: Provision RabbitMQ namespace
  ansible.builtin.shell: |
    set -eu

    RABBITMQ_CONTAINER="$(
      docker compose \
        --project-directory "{{ rabbitmq_shared_project_dir }}" \
        -p "{{ rabbitmq_shared_project_name }}" \
        -f "{{ rabbitmq_shared_project_dir }}/docker-compose.yml" \
        ps -q rabbitmq
    )"

    if [ -z "$RABBITMQ_CONTAINER" ]; then
      echo "RabbitMQ shared service container not found for {{ rabbitmq_shared_project_name }}" >&2
      exit 1
    fi

    docker exec \
      -e RABBITMQ_NAMESPACE \
      -e RABBITMQ_USERNAME \
      "$RABBITMQ_CONTAINER" \
      sh -ec '
        if rabbitmqctl list_vhosts --silent | grep -Fx "$RABBITMQ_NAMESPACE" >/dev/null; then
          echo "RabbitMQ vhost $RABBITMQ_NAMESPACE already exists"
        else
          rabbitmqctl add_vhost "$RABBITMQ_NAMESPACE"
          echo "created RabbitMQ vhost $RABBITMQ_NAMESPACE"
        fi

        rabbitmqctl set_permissions -p "$RABBITMQ_NAMESPACE" "$RABBITMQ_USERNAME" ".*" ".*" ".*"
        rabbitmqctl list_vhosts --silent | grep -Fx "$RABBITMQ_NAMESPACE"
      '
  environment:
    RABBITMQ_NAMESPACE: "{{ rabbitmq_namespace }}"
    RABBITMQ_USERNAME: "{{ rabbitmq_username }}"
    RABBITMQ_PASSWORD: "{{ rabbitmq_password }}"
  changed_when: true
