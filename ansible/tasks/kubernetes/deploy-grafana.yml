---
- name: Resolve K3s Grafana facts
  set_fact:
    k3s_grafana_namespace: "{{ k3s_grafana.namespace | default('grafana') }}"
    k3s_grafana_domain: "{{ k3s_grafana.domain }}"
    k3s_grafana_manifest_file: /var/lib/rancher/k3s/server/manifests/grafana.yaml
    k3s_grafana_external_release: "{{ ('external-' ~ k3s_grafana.domain) | regex_replace('[^A-Za-z0-9-]', '-') | lower | truncate(53, true, '') }}"
    grafana_admin_user: "{{ k3s_grafana.admin_user | default(lookup('env', k3s_grafana.admin_user_secret_name | default('GRAFANA_PROD_USER'))) }}"
    grafana_admin_password: "{{ k3s_grafana.admin_password | default(lookup('env', k3s_grafana.admin_password_secret_name | default('GRAFANA_PROD_PASSWORD'))) }}"

- name: Validate Grafana admin credentials
  assert:
    that:
      - grafana_admin_user | length > 0
      - grafana_admin_password | length > 0
    fail_msg: >-
      Grafana requires admin credentials in GitHub Secrets:
      {{ k3s_grafana.admin_user_secret_name | default('GRAFANA_PROD_USER') }} and
      {{ k3s_grafana.admin_password_secret_name | default('GRAFANA_PROD_PASSWORD') }}.

- name: Prepare host log directories for Promtail
  file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ (k3s_grafana.promtail | default({})).positions_dir | default('/var/lib/promtail') }}"
      mode: "0777"
    - path: /var/log/pods
      mode: "0755"
    - path: /var/log/containers
      mode: "0755"
  when:
    - (k3s_grafana.promtail | default({})).enabled | default((k3s_grafana.loki | default({})).enabled | default(true)) | bool

- name: Ensure existing K3s pod logs are readable by Promtail
  shell: |
    set -eu
    if [ -d /var/log/pods ]; then
      find /var/log/pods -type d -exec chmod a+rx {} +
      find /var/log/pods -type f -exec chmod a+r {} +
    fi
    if [ -d /var/log/containers ]; then
      find /var/log/containers -type d -exec chmod a+rx {} +
      find /var/log/containers -type f -exec chmod a+r {} +
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - (k3s_grafana.promtail | default({})).enabled | default((k3s_grafana.loki | default({})).enabled | default(true)) | bool

- name: Remove old external Grafana route release
  command: >
    /usr/local/bin/helm uninstall {{ k3s_grafana_external_release }}
    --namespace external-routes
    --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
  register: k3s_grafana_external_release_cleanup
  changed_when: k3s_grafana_external_release_cleanup.rc == 0
  failed_when: false
  when: k3s_grafana.cleanup_external_route | default(true) | bool

- name: Render K3s Grafana manifest
  template:
    src: ../templates/grafana-k3s-manifest.yaml.j2
    dest: "{{ k3s_grafana_manifest_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Apply K3s Grafana manifest
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    apply -f {{ k3s_grafana_manifest_file }}
  register: k3s_grafana_apply
  changed_when: "'created' in k3s_grafana_apply.stdout or 'configured' in k3s_grafana_apply.stdout"

- name: Restart Grafana after provisioning changes
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    -n {{ k3s_grafana_namespace }}
    rollout restart deployment/grafana
  register: k3s_grafana_restart
  changed_when: "'restarted' in k3s_grafana_restart.stdout"

- name: Restart Promtail after scrape config changes
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    -n {{ k3s_grafana_namespace }}
    rollout restart daemonset/promtail
  register: k3s_promtail_restart
  changed_when: "'restarted' in k3s_promtail_restart.stdout"
  when:
    - (k3s_grafana.promtail | default({})).enabled | default((k3s_grafana.loki | default({})).enabled | default(true)) | bool

- name: Wait for Grafana rollout
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    -n {{ k3s_grafana_namespace }}
    rollout status deployment/grafana
    --timeout={{ k3s_grafana.rollout_timeout | default('180s') }}
  changed_when: false

- name: Reset Grafana admin password in existing database
  shell: |
    set -eu
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }} \
      -n {{ k3s_grafana_namespace | quote }} \
      exec deployment/grafana -- \
      grafana cli admin reset-admin-password "${GRAFANA_ADMIN_PASSWORD}"
  args:
    executable: /bin/bash
  environment:
    GRAFANA_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
  changed_when: true
  no_log: true
  when: k3s_grafana.reset_admin_password | default(true) | bool

- name: Wait for Grafana TLS certificate
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    -n {{ k3s_grafana_namespace }}
    wait certificate grafana-tls
    --for=condition=Ready
    --timeout={{ k3s_grafana.certificate_ready_timeout | default('180s') }}
  register: k3s_grafana_certificate_wait
  changed_when: false
  failed_when: false
  when:
    - k3s.cert_manager.enabled | default(false) | bool
    - k3s.cert_manager.cluster_issuer.enabled | default(true) | bool
    - k3s_grafana_domain | default('') | length > 0

- name: Show Grafana certificate status when not ready
  command: >
    /usr/local/bin/k3s kubectl --kubeconfig {{ k3s.kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}
    -n {{ k3s_grafana_namespace }}
    describe certificate grafana-tls
  register: k3s_grafana_certificate_status
  changed_when: false
  failed_when: false
  when:
    - k3s_grafana_certificate_wait is defined
    - k3s_grafana_certificate_wait.rc | default(0) != 0

- name: Fail when Grafana TLS certificate is not ready
  fail:
    msg: |
      TLS certificate for {{ k3s_grafana_domain }} did not become Ready.

      kubectl wait:
      {{ k3s_grafana_certificate_wait.stderr | default(k3s_grafana_certificate_wait.stdout | default('unavailable')) }}

      Certificate status:
      {{ k3s_grafana_certificate_status.stdout | default(k3s_grafana_certificate_status.stderr | default('unavailable')) }}
  when:
    - k3s_grafana_certificate_wait is defined
    - k3s_grafana_certificate_wait.rc | default(0) != 0

- name: Verify Traefik serves Grafana domain certificate
  shell: |
    set -eu
    echo | openssl s_client \
      -connect {{ k3s.traefik_acme.verify_connect_host | default(ansible_host | default(inventory_hostname)) }}:443 \
      -servername {{ k3s_grafana_domain | quote }} \
      -verify_hostname {{ k3s_grafana_domain | quote }} \
      2>&1 |
      openssl x509 -noout -subject -issuer -ext subjectAltName
  args:
    executable: /bin/bash
  register: k3s_grafana_served_certificate
  changed_when: false
  retries: "{{ k3s_grafana.certificate_verify_retries | default(18) }}"
  delay: "{{ k3s_grafana.certificate_verify_delay_seconds | default(10) }}"
  until:
    - k3s_grafana_served_certificate.rc == 0
    - "'TRAEFIK DEFAULT CERT' not in k3s_grafana_served_certificate.stdout"
    - k3s_grafana_domain in k3s_grafana_served_certificate.stdout
  failed_when: >-
    k3s_grafana_served_certificate.rc != 0 or
    'TRAEFIK DEFAULT CERT' in k3s_grafana_served_certificate.stdout or
    k3s_grafana_domain not in k3s_grafana_served_certificate.stdout
  when: k3s_grafana_domain | default('') | length > 0
