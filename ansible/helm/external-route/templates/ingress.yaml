apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "external-route.fullname" . }}
  labels:
    {{- include "external-route.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "external-route.fullname" . }}
                port:
                  name: http
