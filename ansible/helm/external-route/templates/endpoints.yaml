{{- if regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}$" .Values.backend.host }}
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ include "external-route.fullname" . }}
  labels:
    {{- include "external-route.labels" . | nindent 4 }}
subsets:
  - addresses:
      - ip: {{ .Values.backend.host }}
    ports:
      - name: http
        port: {{ .Values.backend.port }}
        protocol: TCP
{{- end }}
