replicaCount: 2

image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent

command: []
args: []
imagePullSecrets: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 80
  nodePort: null

ingress:
  enabled: false
  className: traefik
  host: ""
  tls:
    enabled: false
    secretName: ""

env: {}
secretEnv: {}
resources: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
volumeMounts: []
