replicaCount: 1

strategy:
  maxUnavailable: 0
  maxSurge: 1

minReadySeconds: 5

image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent

command: []
args: []
imagePullSecrets: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true

tmpVolume:
  enabled: true
  mounts:
    - name: tmp
      mountPath: /tmp
    - name: var-tmp
      mountPath: /var/tmp
    - name: cache
      mountPath: /home/app/.cache
    - name: node-cache
      mountPath: /home/node/.cache

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 80
  nodePort: null

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""

env: {}
secretEnv: {}
resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
volumeMounts: []
